# MI355 ROCm Server perf — NVE full-table path (pynve LinearUVM, MPI lookup, Triton
# HSTU, Plan 18 own-device grant, Plan 20 parallel ckpt load). Batch-scaling sweep.
# b=4: amortize per-batch fixed overhead over 4 queries to push the throughput
# ceiling above the b=1 wall (~105 q/s). qps=200 operating point.
*.Server.target_qps = 200
*.Server.min_query_count = 30000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 200
*.Offline.min_query_count = 30000
*.Offline.min_duration = 120000
