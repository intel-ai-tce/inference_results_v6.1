# Server figure of record (b64): batch-amortized A-FUSE+C1+D2 ceiling.
# b64 @ 12000 measured VALID at p99 ~59.8ms in a 90s probe (~20ms under the 80ms bound);
# b64 @ 13000 collapses (knee is sharp). Full 600s PROD cert at the proven point.
*.Server.target_qps = 12000
*.Server.target_latency = 80
*.Server.target_latency_percentile = 99
*.Server.min_duration = 600000
*.Server.min_query_count = 1
*.Offline.target_qps = 12000
*.Offline.min_duration = 600000
*.Offline.min_query_count = 1
