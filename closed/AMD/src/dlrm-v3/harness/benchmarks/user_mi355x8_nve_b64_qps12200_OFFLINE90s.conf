# Offline throughput probe for the q12,200 GOLD stack -- b64, 90s.
# Offline.target_qps is intentionally above the Server target so LoadGen
# pregenerates enough samples for min_duration even if Offline throughput exceeds
# the q12,200 Server figure.
*.Server.target_qps = 12200
*.Server.target_latency = 80
*.Server.target_latency_percentile = 99
*.Server.min_duration = 90000
*.Server.min_query_count = 1
*.Offline.target_qps = 14000
*.Offline.min_duration = 90000
*.Offline.min_query_count = 1
