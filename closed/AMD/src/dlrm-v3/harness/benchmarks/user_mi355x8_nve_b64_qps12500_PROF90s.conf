# Server headroom probe — b64 @ 12500 qps, 90s. Tests the CUDA-streams dispatch
# ceiling: streams cut batch.period 45->41ms (1.13x), lifting the period-bound
# ceiling from ~12000 to ~12500 q/s. baseline b64@12000 VALID p99 59ms.
*.Server.target_qps = 12500
*.Server.target_latency = 80
*.Server.target_latency_percentile = 99
*.Server.min_duration = 90000
*.Server.min_query_count = 1
*.Offline.target_qps = 12500
*.Offline.min_duration = 90000
*.Offline.min_query_count = 1
