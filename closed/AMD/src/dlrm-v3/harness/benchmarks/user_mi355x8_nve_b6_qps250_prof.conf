# Profiling conf — NVE full-table path, b=6, stable qps=250 (well under the ~290
# ceiling so per-batch GPU work is measured without queue saturation). Short run:
# enough batches to pass DLRM_TORCH_PROFILER_SKIP then capture the window.
*.Server.target_qps = 250
*.Server.min_query_count = 8000
*.Server.target_latency = 80
*.Server.min_duration = 25000
*.Server.max_duration = 60000

*.Offline.target_qps = 250
*.Offline.min_query_count = 8000
*.Offline.min_duration = 25000
