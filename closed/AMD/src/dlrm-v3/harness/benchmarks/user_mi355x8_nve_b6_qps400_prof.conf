# Plan 21 diagnostic — drive WELL PAST the ~290 q/s cliff to see whether batch
# delivery is dispatch-capped (period stays ~165 ms, workers stay idle, queries
# pile up at LoadGen) or whether workers actually saturate (period -> ~12 ms,
# predict grows). Short run; we only need the steady-state period/qdepth.
*.Server.target_qps = 400
*.Server.min_query_count = 12000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 70000

*.Offline.target_qps = 400
*.Offline.min_query_count = 12000
*.Offline.min_duration = 30000
