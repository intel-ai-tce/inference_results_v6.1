# Short ceiling/latency probe (DLRM_ZMQ_TRACE=0). Push target_qps high to find the
# real dispatch ceiling (completed q/s) and tail latency with tracing disabled.
*.Server.target_qps = 400
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 25000
*.Server.max_duration = 45000

*.Offline.target_qps = 400
*.Offline.min_query_count = 6000
*.Offline.min_duration = 25000
