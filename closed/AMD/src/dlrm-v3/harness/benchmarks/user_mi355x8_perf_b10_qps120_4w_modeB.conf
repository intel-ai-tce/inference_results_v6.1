# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=4 batch=10.
#
# Same conf as 2W variant. qps=120 isolates the route_lookup comms cost
# scaling vs W; latency validity is a separate concern (batch_fill at
# b=10 already eats most of the 80 ms p99 budget).
*.Server.target_qps = 120
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 120
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
