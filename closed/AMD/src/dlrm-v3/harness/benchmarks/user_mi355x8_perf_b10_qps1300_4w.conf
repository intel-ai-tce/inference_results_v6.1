# MI355 ROCm Server perf — multi-worker scale-out (NUM_WORKERS=4, batch=10).
#
# Math: with NUM_SHARDS=W and DLRM_ZMQ_MAX_INFLIGHT=W, each worker
# pipelines independently at the single-W tight ceiling (~327 q/s).
# Use qps = single_W_tight * W = 325 * 4 = 1300 (per-worker 325 q/s).
*.Server.target_qps = 1300
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 1300
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
