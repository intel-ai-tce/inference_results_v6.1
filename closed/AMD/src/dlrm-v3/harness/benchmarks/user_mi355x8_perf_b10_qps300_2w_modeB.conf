# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10.
#
# Mode B uses lockstep dispatch (every worker processes every batch via
# MPI bcast) so the route_lookup all_to_all_single primitive sees every
# worker on every batch. Aggregate throughput = single-worker throughput
# + ~7-10 ms predict.sparse routing overhead per batch — does NOT scale
# with W. Mode B's only win is memory sharding (1/W per rank), which is
# only required at production caps where Mode A would OOM (1 B rows ×
# 512 × fp16 ≈ 1 TB does not fit replicated on any GPU).
#
# Per-batch service time ~ 30-35 ms (~22 ms predict + 7-10 ms route),
# so per-worker batch rate ~ 28-33 batches/s = 280-330 q/s aggregate
# (= NOT per-worker, total). qps=300 keeps ρ ≈ 0.9 with one batch in
# flight. LG-side batch-fill ~ 1.5 * 10 / 300 = 50 ms. Total budget
# 50 + 32 = 82 ms — right at the edge of the 80 ms target. Likely
# INVALID; if so confirms Mode B is a memory-sharding config, not a
# Server-scenario throughput config at smoke cap.
*.Server.target_qps = 300
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 300
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
