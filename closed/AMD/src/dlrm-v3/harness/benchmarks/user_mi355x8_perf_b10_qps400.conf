# MI355 ROCm Server perf — high-side VALID (batch_size=10, target_qps=400, 60 s).
#
# Math at observed batch.predict p99 = 24.5 ms (Mode A GPU sparse, 1 worker):
#   batch_fill_p99 (Poisson) ~ 1.5 * batch_size / qps = 1.5 * 10 / 400 = 37.5 ms
#   predict_p99 + fill_p99   = 24.5 + 37.5 = 62 ms < 80 ms => VALID expected
#   sustainable rate         : 1 / 0.0245 ~ 40 batches/s = 408 q/s
#
# qps=400 leaves ~2% headroom on sustained throughput; expect mild backlog
# on tail. If P99 creeps over 80 ms, fall back to qps=350. If VALID with
# tight tail, push qps=450 next.
*.Server.target_qps = 400
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 180000

*.Offline.target_qps = 400
*.Offline.min_query_count = 2000
*.Offline.min_duration = 60000
