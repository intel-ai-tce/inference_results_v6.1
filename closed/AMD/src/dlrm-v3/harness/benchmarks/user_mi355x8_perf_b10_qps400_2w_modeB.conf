# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10
# Plan 04 + RCCL on-device routing — qps=400 over-ceiling / queue
# collapse probe.
#
# Mode B + RCCL service rate = ~425 q/s aggregate at b=10 (lockstep
# dispatch → compute parallelism = 1×). At qps=400, ρ = 400/425 =
# 0.94, M/D/1 tail explodes (Pollaczek-Khinchine p99 ~ 200+ ms);
# expected INVALID with p99 several × the 80 ms target. Mirrors the
# Mode A 1W INVALID bracket point (Mode A 1W at qps=400 hit 2.8 s p99
# from queue collapse — see documents/09_Phase3_Server_VALID_Tune.md).
*.Server.target_qps = 400
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 400
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
