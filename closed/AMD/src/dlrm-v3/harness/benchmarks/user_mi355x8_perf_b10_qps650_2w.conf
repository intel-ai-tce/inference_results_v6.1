# MI355 ROCm Server perf — multi-worker scale-out (NUM_WORKERS=2, batch=10).
#
# Math: with NUM_SHARDS=W (one ZMQ PUSH socket per worker) and
# DLRM_ZMQ_MAX_INFLIGHT=W (one in-flight slot per worker), each worker
# sees its own independent 1/W of the load and predict pipelines in
# parallel — analogous to W copies of the single-worker tight ceiling.
# Per-worker rate ~ 327 q/s @ batch=10, so 2W aggregate ceiling ~ 650.
# Use qps=650 / 2 = 325 q/s per-worker (matches single-W tight VALID).
*.Server.target_qps = 650
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 650
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
