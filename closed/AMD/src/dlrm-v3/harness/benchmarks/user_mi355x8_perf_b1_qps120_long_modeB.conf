# MI355 ROCm Server perf — Mode B b=1 W=2, Plan 04 + RCCL on-device
# routing — qps=120 tight-ceiling probe (long variant for early-stop
# certification).
#
# qps=110 long VALID at p99=67.8 ms; qps=130 hit queue collapse at
# p99=176 ms (short run). qps=120 splits the bracket. ρ ≈ 0.94 against
# the ~128 q/s effective ceiling — queue tail is the gating factor.
*.Server.target_qps = 120
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 120
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
