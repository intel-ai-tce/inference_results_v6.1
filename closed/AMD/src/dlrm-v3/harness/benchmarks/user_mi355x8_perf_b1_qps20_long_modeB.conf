# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=20 LONG.
#
# Cross-check operating point for W=4 / W=8. Lower than W=2's
# qps=100 VALID ceiling but the lockstep MPI fan-out at W≥4 widens
# the tail, and we want safe statistical certification. At qps=20
# with service ~7 ms, rho ≈ 0.14 and p99 should be < 30 ms at any W.
# min_query_count=10000 gives MLPerf early-stopping ~3× headroom.
*.Server.target_qps = 20
*.Server.min_query_count = 10000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 900000

*.Offline.target_qps = 20
*.Offline.min_query_count = 10000
*.Offline.min_duration = 60000
