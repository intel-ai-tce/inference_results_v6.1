# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=25 W=2.
#
# Stretch target near the service-rate ceiling. With service ~37 ms,
# rho at qps=25 ≈ 0.93 — almost guaranteed unstable tail under any
# arrival jitter. Run only after qps20 lands VALID; this is the
# bracket-INVALID anchor for the b=1 frontier.
*.Server.target_qps = 25
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 25
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
