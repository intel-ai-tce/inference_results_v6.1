# MI355 ROCm Server perf — Mode B b=2 W=2, Plan 04 + RCCL — qps=200
# (long variant, 60 s / 6000 q for MLPerf early-stopping certification).
#
# Batch-size sweep follow-up to documents/13 + WORK_LOG.md §23.
# b=1 W=2 RCCL VALID at qps=110 p99=67.8 ms; b=10 has no VALID ceiling
# (batch-fill p99 ≥ 50 ms at every qps). b=2 should split the gap:
# service ~8 ms (linear interp b=1=6ms / b=10=24ms), batch-fill p99
# at b=2 = single exponential inter-arrival = ln(100)/qps × 1000 ≈
# 4.6/qps × 1000 ms = 23 ms at qps=200. Total predicted p99 ≈ 8 + 23
# + small queue (ρ=0.8 at single-worker rate ~125 b/s, lockstep
# aggregate ~250 q/s) = ~50-70 ms — comfortable VALID with margin.
*.Server.target_qps = 200
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 200
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
