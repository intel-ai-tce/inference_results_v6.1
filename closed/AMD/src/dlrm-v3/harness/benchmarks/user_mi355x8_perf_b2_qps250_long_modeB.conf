# MI355 ROCm Server perf — Mode B b=2 W=2, Plan 04 + RCCL — qps=250
# (long variant for early-stop certification).
#
# Edge probe: batch-fill p99 = 4.6/250 × 1000 = 18 ms; service ~8 ms;
# ρ ≈ 1.0 against the predicted ~250 q/s aggregate ceiling so queue
# tail will dominate. Predicted p99 ≈ 60-80 ms — at the edge.
*.Server.target_qps = 250
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 250
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
