# MI355 ROCm Server perf — Mode B b=6 W=4/8, Plan 04 + RCCL — qps=225
# extra-long variant (120 s / 30000 q) for W=8 headline re-anchor after
# the MSCCL count=0 alltoallv bug workaround (RCCL_MSCCL_ENABLE=0) was
# identified per dlrmv2-training documents/12 cross-reference.
#
# W=4 b=6 qps=225 (default RCCL): VALID 226.94 q/s p99=68.84 ms 60 s.
# W=8 b=6 qps=225 (default RCCL): RCCL ALLTOALL_BASE watchdog hang
#   (stochastic, diverging rank flips run-to-run).
# W=8 b=6 qps=225 (MSCCL off):    VALID 226.94 q/s p99=69.21 ms 60 s.
# This conf certifies the W=8 (MSCCL off) result over 120 s / 27000 q.
*.Server.target_qps = 225
*.Server.min_query_count = 27000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 225
*.Offline.min_query_count = 27000
*.Offline.min_duration = 120000
