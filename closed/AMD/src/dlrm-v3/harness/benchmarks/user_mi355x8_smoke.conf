# MI355 ROCm smoke — exactly one batch (10 queries); min_duration=1 ms so LoadGen
# does not keep issuing queries while the worker JITs Triton on later shapes.
*.Server.target_qps = 10
*.Server.min_query_count = 10
*.Server.target_latency = 80
*.Server.min_duration = 1
*.Server.max_duration = 60000

*.Offline.target_qps = 10
*.Offline.min_query_count = 10
*.Offline.min_duration = 1
