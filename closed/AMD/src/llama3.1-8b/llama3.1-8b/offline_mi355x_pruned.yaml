  #cudagraph_mode: PIECEWISE 
    #cudagraph_mode: FULL_AND_PIECEWISE #NONE, FULL, PIECEWISE, FULL_DECODE_ONLY
    #compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 2048]
    # cudagraph_capture_sizes is generated from cudagraph_capture_range
    #cudagraph_capture_range: [[768, 0, -32], 24, 16, 8, 4, 2, 1]
    #cudagraph_capture_range: [[22016, 0, -64], 56, 48, 40, 32, 24, 16, 8, 4, 2, 1]
  #compilation_config:
    #full_cuda_graph: True
    #cudagraph_capture_sizes: [640, 608, 576, 544, 512,504,496,488,480,472,464,456,448,440,432,424,416,408,400,392,384,376,368,360,352,344,336,328,320,312,304,296,288,280,272,264,256,248,240,232,224,216,208,200,192,184,176,168,160,152,144,136,128,120,112,104,96,88,80,72,64,56,48,40,32,24,16,8,4,2,1]
    #cudagraph_capture_sizes: [1024, 960, 896, 832, 768, 704, 640, 576, 512,448,384,320,256,192,128,64,32,16,8,4,2,1]
    #cudagraph_capture_sizes: [768, 704, 640, 576, 512,448,384,320,256,192,128,64,32,16,8,4,2,1]
  #compilation_config: '{"full_cuda_graph": true}'
