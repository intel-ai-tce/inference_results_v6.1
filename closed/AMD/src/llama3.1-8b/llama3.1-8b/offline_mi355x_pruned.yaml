# configuration related to the sampling params
vllm_sampling_config:
  temperature: 1
  seed: 42
  top_p: 1
  top_k: 1
  max_tokens: 2000
  min_tokens: 2
  ignore_eos: False
  detokenize: False

# configuration related to the harness tests.
harness_config:
  dataset_path: /data/mlperf_llama3.1_405b_dataset_8313_processed_fp16_eval.pkl
  mlperf_conf_path: /app/mlperf_inference/mlperf.conf
  user_conf_path: /lab-mlperf-inference/code/user_mi355x.conf
  target_qps: -1 # 80
  total_sample_count: 24939 #8313
  output_log_dir: /app/logs
  load_balance_token_weight: 0.005
  enable_log_trace: False
  warmup_duration: 0
  enable_warmup: True #True
  warm_up_sample_count_per_server: 20
  sorting:
    strategy: batchpacking
  #sort_samples: ascending # ascending, modulo_desc, batchpacking, descending, modulo_asc, lexicographic
  schedule_algo: shortest_queue_with_tokens
  device_count: 8 #8 
  duration_sec: 1 #-1
