# benchmark details
benchmark_name: llama3_1-8b
scenario: server
test_mode: performance
engine_version: async

vllm_env_config:
  VLLM_LOGGING_LEVEL: "INFO" #"ERROR", "INFO", "DEBUG"
  HARNESS_GC_LIMIT: 100000
  NCCL_MIN_NCHANNELS: 112
  RAY_EXPERIMENTAL_NOSET_ROCR_VISIBLE_DEVICES: 1
  TOKENIZERS_PARALLELISM: False
  VLLM_INSTALL_PUNICA_KERNELS: 1
  VLLM_USE_V1: 1 #0
  VLLM_ROCM_QUICK_REDUCE_QUANTIZATION: INT4
  VLLM_ROCM_QUICK_REDUCE_MAX_SIZE_BYTES_MB: 2560
  VLLM_ROCM_USE_AITER_CUSTOM_ALL_REDUCE: 1
  VLLM_TRITON_FP4_GEMM_USE_ASM: 0
  VLLM_TRITON_FP4_GEMM_SPLITK_USE_BF16: 0 #0 check this one
  TRITON_HIP_ASYNC_COPY_BYPASS_PERMUTE: 1
  AMDGCN_USE_BUFFER_OPS: 1
  TRITON_HIP_USE_ASYNC_COPY: 1
  TRITON_HIP_USE_BLOCK_PINGPONG: 1
  TRITON_HIP_ASYNC_FAST_SWIZZLE: 1
  TRITON_HIP_PRESHUFFLE_SCALES: 1 #1 check this one
  VLLM_ROCM_USE_AITER: 1
  VLLM_ROCM_USE_AITER_PAGED_ATTN: 0 #0, this one has conflict with VLLM_V1_USE_PREFILL_DECODE_ATTENTION
  USE_FASTSAFETENSOR: 1
  SAFETENSORS_FAST_GPU: 1
  VLLM_ROCM_USE_AITER_RMSNORM: 1
  VLLM_USE_TRITON_FLASH_ATTN: 0
  VLLM_USE_AITER_TRITON_ROPE: 1 #1 using 0 with Zsolt's latest docker and older version of harness
  #VLLM_USE_AITER_TRITON_SILU_MUL: 1 #1
  VLLM_TRITON_FP4_GEMM_BPRESHUFFLE: 1 #1 check this one
  VLLM_V1_USE_PREFILL_DECODE_ATTENTION: 0
  VLLM_USE_AITER_UNIFIED_ATTENTION: 0 #0
  #VLLM_ROCM_USE_AITER_MHA: 1 #1
  VLLM_ROCM_USE_AITER_FP4_ASM_GEMM: 1 #1, to check accuracy
  #VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1 # accuracy is failing with this ASM PA
  #VLLM_USE_FUSED_ALLREDUCE_RMSNORM: 1
  VLLM_MIN_REQUEST_DECODE_STEP: 32 #32, 32, 16, 48, 32, 48
  # Cadence now LIVE via code/patches. Server @1031 is TTFT-bound/throughput-
  # saturated (stock: TTFT p99 2251ms INVALID, TPOT p99 93.5ms, completed 1005/1031),
  # so throttling prefill (cadence) only worsens TTFT. Keep OFF (0). (Was 11, inert
  # before the patch was wired in; real lever is lowering target_qps to the valid knee.)
  VLLM_SUBSEQUENT_DECODE_STEPS: 0 #was 11 (inert); 0 = stock (best for TTFT-bound Server)
  # Prefill-tokens-per-step cap (code/patches/apply_prefill_cap_patch.py): splits the
  # rare burst "monster" prefill steps (up to ~73728 tokens in one step) that drive the
  # TTFT tail. MEASURED Server @qps1031 (limits: TTFT p99<=2000ms, TPOT p99<=100ms):
  #   off    -> TTFT p99 1703ms, TPOT p99 76.8ms  (VALID)
  #   16384  -> TTFT p99 1168ms, TPOT p99 62.4ms  (VALID)  [-31% TTFT, -19% TPOT]
  # Improves BOTH tail metrics (and completed 1008->1019/s). 16384 is the Server optimum.
  VLLM_MAX_PREFILL_TOKENS_PER_STEP: 16384 #0=off (stock). measured optimum for Server.
  #VLLM_LLAMA2_MLPERF_SCHED: 1
  #VLLM_LLAMA2_MLPERF_MAX_TARGET_DECODE_BATCH: 2048 #3072
  #VLLM_LLAMA2_MLPERF_MIN_TARGET_DECODE_BATCH: 2048 #3072
  #VLLM_LLAMA2_MLPERF_STEP_DECODE_BATCH: 256 #256
  HARNESS_PRELOAD_AITER_KERNELS: 1 #this one helps
  #VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  #VLLM_SCHED_PREFILL_KVC_FREEPCT: 0.75
  #VLLM_USE_WEIGHT_STREAMING: true
  #RCCL_MSCCL_ENABLE: 1
  #NCCL_NSOCKS_PERTHREAD: 4
  #NCCL_SOCKET_NTHREADS: 4
  #RCCL_MSCCL_ENABLE: 1
  #The following is for fused kernels
  ENGINE: vllm-rocm
  VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: 1 # accuracy with this ASM PA due to GQA,  --num-gpu-blocks-override 131072
  HIP_ONLINE_TUNING: 0
  HSA_NO_SCRATCH_RECLAIM: 1

# configuration related to the LLM model.
vllm_engine_config:
  model: /model/
  tokenizer: /lab-mlperf-inference/code/tokenizer_patch
  dtype: bfloat16
  tensor_parallel_size: 1
  quantization: quark #MXFP4 weights + FP8 KV cache (redline/flywheel q1 model)
  trust_remote_code: True
  max_model_len: 2668
  gpu_memory_utilization: 0.96
  enforce_eager: False #False
  disable_custom_all_reduce: False
  max_num_batched_tokens: 32768 #swept @qps1137.8: 32768 best TTFT p99 1131ms (vs 1608 @73728), same completed ~1122 VALID; 16384 collapses (INVALID)
  max_num_seqs: 4480 #swept @mnbt32768: 4480 as good as any (3456/5504/6528 all VALID ~1121, TTFT noisier)
  enable_chunked_prefill: True #False, True
  attention_backend: ROCM_AITER_FA
  enable_prefix_caching: False
  async_scheduling: True
  num_gpu_blocks_override: 131072 # REQUIRED with VLLM_ROCM_SHUFFLE_KV_CACHE_LAYOUT: shuffle ASM PA computes block offset block_id*16384 in int32; block_id>=131072 overflows 2^31 -> corrupt KV reads -> rouge collapse. Capping blocks to 131072 keeps ids 0..131071 (max index = 2^31-1) safe.
  #kv_cache_dtype: fp8
  #block_size: 16
  compilation_config:
    cudagraph_mode: FULL_AND_PIECEWISE
    compile_sizes: [1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,320,384,448,512,576,640,704,768,832,896,960,1024,1088,1152,1216,1280,1344,1408,1472,1536,1600,1664,1728,1792,1856,1920,1984,2048,2112,2176,2240,2304,2368,2432,2496,2560,2624,2688,2752,2816,2880,2944,3008,3072,3136,3200,3264,3328,3392,3456,3520,3584,3648,3712,3776,3840,3904,3968,4032,4096,4160,4224,4288,4352,4416,4480]
    cudagraph_capture_sizes: [4480,4416,4352,4288,4224,4160,4096,4032,3968,3904,3840,3776,3712,3648,3584,3520,3456,3392,3328,3264,3200,3136,3072,3008,2944,2880,2816,2752,2688,2624,2560,2496,2432,2368,2304,2240,2176,2112,2048,1984,1920,1856,1792,1728,1664,1600,1536,1472,1408,1344,1280,1216,1152,1088,1024,960,896,832,768,704,640,576,512,448,384,320,256,248,240,232,224,216,208,200,192,184,176,168,160,152,144,136,128,120,112,104,96,88,80,72,64,56,48,40,32,24,16,8,4,2,1]   
# configuration related to the sampling params
vllm_sampling_config:
  # temperature=0 -> greedy/argmax fast path (token-identical to temp=1 + top_k=1),
  # skips per-step random-sampling kernels. Validated on Offline: +10.5% throughput.
  temperature: 0 #was 1
  seed: 42
  top_p: 1
  top_k: 1
  max_tokens: 128 
  min_tokens: 1 #2
  ignore_eos: False
  detokenize: False

# configuration related to the harness tests.
harness_config:
  dataset_path: /data/cnn_eval.json
  mlperf_conf_path: /lab-mlperf-inference/mlperf_inference/mlperf.conf
  user_conf_path: /lab-mlperf-inference/code/llama3.1-8b/user_mi355x.conf
  # Prefill-aware request routing across the 8 DP engines (harness-side dispatch,
  # MLPerf-legal). Generalizes shortest_queue: routes by
  #   score = (sent-finished) + beta*(sent-first_seen)
  # up-weighting each engine's PENDING-PREFILL backlog (reqs dispatched but not yet
  # at first token) -- what a new arrival's TTFT actually queues behind (decoding
  # reqs cost ~nothing/step). Plain shortest_queue (beta=0) counts decoders equally
  # and mis-routes bursts. Impl: harness_llm/backends/common/{server_utils,server_sut}.py.
  # MEASURED (MI355X 8x, qps~1155, cap=16384; limits TTFT p99<=2000ms/TPOT p99<=100ms):
  #   shortest_queue (beta=0): TTFT p99 2377ms / TPOT p99 77ms -> INVALID
  #   beta=4 : 702ms / 70ms VALID | beta=8 : 650ms / 69ms VALID | beta=16 : 679ms / 68ms VALID
  # beta=8 is the knee: -73% TTFT p99 (2377->650), flips INVALID->VALID, also lowers
  # TPOT (better balance). Large margin on both axes now -> qps ceiling can go higher.
  schedule_algo: shortest_queue_prefill #was shortest_queue (default); prefill-backlog-aware
  prefill_backlog_weight: 8 #beta; 0==shortest_queue. measured knee for Server
  target_qps: -1 # 80
  total_sample_count: 13368 #13368
  output_log_dir: /lab-mlperf-inference/logs
  enable_log_trace: False
  warmup_duration: 0
  enable_warmup: True #False
  warm_up_sample_count_per_server: 8800  
  device_count: 8 #8, 1
  debug_dump_model_output: False 
