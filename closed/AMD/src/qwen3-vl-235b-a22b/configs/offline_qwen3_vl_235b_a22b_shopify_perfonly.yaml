# Offline Benchmark - Qwen3-VL-235B-A22B on Shopify Product Catalogue
# PERF-ONLY variant of offline_qwen3_vl_235b_a22b_shopify.yaml: byte-identical EXCEPT the
# accuracy dataset entry is dropped, so the client issues ONLY the performance dataset. This
# isolates the effect of the concurrent accuracy issuer on offline tracked qps (both-phases
# stretches the tracked window vs perf-only). NOT a submission config (a valid submission
# requires the accuracy phase).
name: "offline-qwen3-vl-235b-a22b-shopify-benchmark"
version: "1.0"
type: "offline"
timeout: 14400
model_params:
  name: amd/Qwen3-VL-235B-A22B-Instruct-MXFP4-mlperf6.1-closed

datasets:
  - name: shopify_product_catalogue::q3vl
    type: "performance"

settings:
  runtime:
    min_duration_ms: 600000
    scheduler_random_seed: 16159082839903944936 # MLPerf v6.1 mandated schedule_rng_seed
    dataloader_random_seed: 2747215439041700203 # MLPerf v6.1 mandated sample_index_rng_seed

  load_pattern:
    type: "max_throughput"

  # Perf drain timeout defaults to 240s (schema.py DrainConfig). Offline issues all 48289
  # samples up-front; 8xTP1 needs ~490-540s to complete them, so 240s truncates the run
  # (tail abandoned -> ~20763/244s). Raise it so ALL 48289 complete uncontended, giving a
  # perf-only throughput directly comparable to the both-phases perf phase (whose tail only
  # completes because the following accuracy phase's indefinite drain keeps the session alive).
  drain:
    performance_timeout_s: 1200

  client:
    num_workers: 16
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 4096
    # Increase timeout for slow worker startup (spawn, imports). Default 40s may be too short.
    worker_initialization_timeout: 120

endpoint_config:
  endpoints:
    - "http://localhost:8000"
  api_key: null

report_dir: results/qwen3_vl_235b_a22b_shopify_benchmark_offline/
