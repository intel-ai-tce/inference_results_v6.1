variables:
  # Disagg: 2 CTX x 4GPU + 7 GEN x 8GPU = 8 + 56 = 64 GPUs / 16 nodes.
  NUM_CTX_SERVERS:
    type: integer
    value: 2
  GPUS_PER_CTX_RANK:
    type: integer
    value: 4
  NUM_GEN_SERVERS:
    type: integer
    value: 7
  GPUS_PER_GEN_RANK:
    type: integer
    value: 8
  NUM_FRONTEND_SERVERS:
    type: integer
    value: 5
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.NUM_CTX_SERVERS * variables.GPUS_PER_CTX_RANK + variables.NUM_GEN_SERVERS * variables.GPUS_PER_GEN_RANK }}

  BASE_PORT:
    value: 8336
  FRONTEND_PORT:
    value: 8000

  MODEL_PATH:
    value: /home/mlperf_inference_storage/models/deepseek-r1/fp4-quantized-modelopt/deepseek_r1-torch-fp4
  TRTLLM_YAML_CTX:
    value: /work/configs/deepseek_r1/GB300-NVL72_GB300-288GB_aarch64x72/TRTLLM/Interactive/trtllm-serve-disagg-ctx-dep4.yaml
  TRTLLM_ENV_YAML_CTX:
    value: /work/configs/deepseek_r1/GB300-NVL72_GB300-288GB_aarch64x72/TRTLLM/Interactive/trtllm-serve-disagg-ctx-dep4-env.yaml
  TRTLLM_YAML_GEN:
    value: /work/configs/deepseek_r1/GB300-NVL72_GB300-288GB_aarch64x72/TRTLLM/Interactive/trtllm-serve-disagg-gen-dep8.yaml
  TRTLLM_ENV_YAML_GEN:
    value: /work/configs/deepseek_r1/GB300-NVL72_GB300-288GB_aarch64x72/TRTLLM/Interactive/trtllm-serve-disagg-gen-dep8-env.yaml

  BENCHMARK:
    value: deepseek-r1
  SCENARIO:
    value: Interactive
  SYSTEM_NAME:
    value: GB300-NVL72_GB300-288GB_aarch64x72
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
