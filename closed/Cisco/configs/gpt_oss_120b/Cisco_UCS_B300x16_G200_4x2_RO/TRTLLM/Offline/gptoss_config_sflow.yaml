variables:
  # IFB topology — B300 x16 scale (2 nodes x 8 GPU, one DP rank per GPU).
  DP_MULTIPLICITY:
    type: integer
    value: 16
  GPUS_PER_DP_RANK:
    type: integer
    value: 1
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.DP_MULTIPLICITY * variables.GPUS_PER_DP_RANK }}

  BASE_PORT:
    value: 8336

  MODEL_PATH:
    # gpt-oss-120b checkpoint on shared storage mounted at /home/mlperf_inference_storage
    # (see the portable site template's SCRATCH_DIR setting).
    value: /home/mlperf_inference_storage/models/gpt-oss/gpt-oss-120b
  TRTLLM_YAML:
    value: /work/configs/gpt_oss_120b/Cisco_UCS_B300x16_G200_4x2_RO/TRTLLM/Offline/trtllm-serve-ifb-1gpu.yaml
  TRTLLM_ENV_EXPORTS:
    value: |
      export TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER='1'
      export OMP_NUM_THREADS='4'
      export UCX_NET_DEVICES=''
      export TRTLLM_UCX_INTERFACE=''
      export UCX_TLS='rc,sm,cuda,self'
      export UCX_RNDV_SCHEME='put_zcopy'
      export UCX_CUDA_IPC_ENABLE_MNNVL='n'
      export UCX_LOG_LEVEL='warn'
      export MLPINF_WORKER_INITIALIZATION_TIMEOUT='120'
      export SERVER_READY_TIMEOUT='1800'
  HTTP_INTERFACE:
    value: ""
  HARNESS_CONFIG_DIR:
    value: /work/configs/gpt_oss_120b/Cisco_UCS_B300x16_G200_4x2_RO/TRTLLM/Offline

  BENCHMARK:
    value: gpt-oss-120b
  SCENARIO:
    value: Offline
  SYSTEM_NAME:
    value: B300-SXM-270GBx16
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  LOADGEN_MODE:
    description: >-
      'full' = submission-valid loadgen settings from harness.py. 'dev' = short
      probe run (exports MLPINF_LOADGEN_MODE=dev; harness.py swaps in short
      min_duration + reduced sample count + MLPINF_DEV_QPS -> offline_expected_qps).
    value: full
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
