backend: pytorch
tensor_parallel_size: 1
pipeline_parallel_size: 1
# Per-GPU value. 2048 matches the conservative HPE base and is proven to start
# on this newer PyTorch backend; 2272 increases executor memory pressure.
max_batch_size: 2048
# Match the HPE build/runtime token budget for each independent GPU endpoint.
max_num_tokens: 2048
max_seq_len: 2668
print_iter_log: false
enable_iter_perf_stats: false
return_perf_metrics: false
enable_layerwise_nvtx_marker: false
stream_interval: 20
enable_chunked_prefill: true
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: FIRST_COME_FIRST_SERVED
kv_cache_config:
  dtype: fp8
  # HPE's older backend used 0.95/0.99. This backend failed executor startup at
  # 0.95 with batch 2048; 0.90 completed full Server runs without startup OOM.
  free_gpu_memory_fraction: 0.90
  enable_block_reuse: false
num_postprocess_workers: 2
torch_compile_config:
  enable_fullgraph: true
  enable_inductor: false
  enable_piecewise_cuda_graph: true
  enable_userbuffers: false
  capture_num_tokens: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 768, 1024, 1536, 2048]
sampler_type: TRTLLMSampler
