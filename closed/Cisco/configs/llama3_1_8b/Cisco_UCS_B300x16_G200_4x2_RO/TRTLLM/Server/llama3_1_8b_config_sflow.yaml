variables:
  # Causal 6CTX+10GEN midpoint between the measured 8CTX+8GEN control and
  # validated 4CTX+12GEN branch. Worker configs and all non-topology fields
  # stay fixed; two GPUs move from context to generation.
  NUM_CTX_SERVERS:
    type: integer
    value: 6
  GPUS_PER_CTX_RANK:
    type: integer
    value: 1
  NUM_GEN_SERVERS:
    type: integer
    value: 10
  GPUS_PER_GEN_RANK:
    type: integer
    value: 1
  NUM_FRONTEND_SERVERS:
    type: integer
    value: 2
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.NUM_CTX_SERVERS * variables.GPUS_PER_CTX_RANK + variables.NUM_GEN_SERVERS * variables.GPUS_PER_GEN_RANK }}

  BASE_PORT:
    value: 8336
  FRONTEND_PORT:
    value: 8000

  MODEL_PATH:
    value: /home/mlperf_inference_storage/models/Llama3.1-8B/fp4-quantized-modelopt/llama3_1-8b-instruct-hf-torch-fp4
  TRTLLM_YAML_CTX:
    value: /work/configs/llama3_1_8b/Cisco_UCS_B300x16_G200_4x2_RO/TRTLLM/Server/trtllm-serve-disagg-ctx-1gpu.yaml
  TRTLLM_ENV_EXPORTS_CTX:
    value: |
      export TRTLLM_SERVER_DISABLE_GC='1'
      export TRTLLM_WORKER_DISABLE_GC='1'
      export TRTLLM_ENABLE_PDL='1'
      export UCX_LOG_LEVEL='warn'
      export PYTHONPATH='/work/src'
      export NCCL_IB_GID_INDEX='3'
      export UCX_NET_DEVICES=''
      export TRTLLM_UCX_INTERFACE=''
      export UCX_TLS='rc,sm,cuda,self'
      export UCX_RNDV_SCHEME='put_zcopy'
      export UCX_CUDA_IPC_ENABLE_MNNVL='n'
      export MLPINF_WORKER_INITIALIZATION_TIMEOUT='120'
      export SERVER_READY_TIMEOUT='1800'
  TRTLLM_YAML_GEN:
    value: /work/configs/llama3_1_8b/Cisco_UCS_B300x16_G200_4x2_RO/TRTLLM/Server/trtllm-serve-disagg-gen-1gpu.yaml
  TRTLLM_ENV_EXPORTS_GEN:
    value: |
      export TRTLLM_SERVER_DISABLE_GC='1'
      export TRTLLM_WORKER_DISABLE_GC='1'
      export TRTLLM_ENABLE_PDL='1'
      export UCX_LOG_LEVEL='warn'
      export PYTHONPATH='/work/src'
      export NCCL_IB_GID_INDEX='3'
      export UCX_NET_DEVICES=''
      export TRTLLM_UCX_INTERFACE=''
      export UCX_TLS='rc,sm,cuda,self'
      export UCX_RNDV_SCHEME='put_zcopy'
      export UCX_CUDA_IPC_ENABLE_MNNVL='n'
      export MLPINF_WORKER_INITIALIZATION_TIMEOUT='120'
      export SERVER_READY_TIMEOUT='1800'
  HTTP_INTERFACE:
    value: ""
  HARNESS_CONFIG_DIR:
    value: /work/configs/llama3_1_8b/Cisco_UCS_B300x16_G200_4x2_RO/TRTLLM/Server

  BENCHMARK:
    value: llama3.1-8b
  SCENARIO:
    value: Server
  SYSTEM_NAME:
    value: B300-SXM-270GBx16
  TEST_MODE:
    value: PerformanceOnly
  LOADGEN_MODE:
    value: dev
  HARNESS_EXTRA_ARGS:
    value: ""
