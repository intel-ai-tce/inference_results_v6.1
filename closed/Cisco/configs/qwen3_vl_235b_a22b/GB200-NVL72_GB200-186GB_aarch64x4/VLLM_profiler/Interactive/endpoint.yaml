# inference-endpoint config — GB200-NVL4 Q3VL Nsight profiling, INTERACTIVE mode.
# Online/poisson load, streaming on (latency-shaped, low QPS). Same as the Server profile
# but drives the smaller 8k shopify dataset at the interactive load point. Short run with a
# 5-min HARD STOP (max_duration_ms) — profiling only needs to cover the cuda profiler's
# delay+max window.

name: "profile-interactive-qwen3-vl-235b-a22b-shopify-8k-gb200x4"
version: "1.0"
type: "online"
timeout: 14400

submission_ref:
  model: "qwen3-vl-235b-a22b"
  ruleset: "mlperf-inference-v6.1"

model_params:
  name: "${MODEL_NAME}"
  top_p: 1
  max_new_tokens: 150
  streaming: "on"

datasets:
  - name: shopify_product_catalogue_8k::q3vl
    type: "performance"

settings:
  warmup:
    enabled: true
    n_requests: 400
    drain: true

  runtime:
    # min = floor, max = HARD STOP at 5 min (loadgen halts regardless of remaining samples).
    min_duration_ms: 120000
    max_duration_ms: 300000
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    # Interactive = latency-shaped, low QPS (matches the non-profiler Interactive
    # scenario's load point — single TP=4 instance at target_qps 1).
    type: "poisson"
    target_qps: 1

  client:
    num_workers: 5
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 1000
    worker_initialization_timeout: 120

  # Client-side profiler trigger.
  # engine: vllm => POST /start_profile at perf-phase start, /stop_profile at end.
  # Optional `urls: [...]` overrides where those triggers point (default: derived from
  # endpoint_config.endpoints, i.e. the vLLM serve URL).
  profiling:
    engine: vllm

endpoint_config:
  # Bare host, NO /v1 (chat path appends v1/chat/completions; profile URL strips /v1).
  endpoints:
    - "${FRONTEND_URL:-http://localhost:8000}"
  api_key: null

report_dir: results/qwen3_vl_235b_a22b_profile_interactive_gb200x4/
