          VLLM_ROCM_USE_AITER_TRITON_ROPE: '0'
          VLLM_ROCM_USE_AITER_FP4_ASM_GEMM: '1'
          VLLM_ATTENTION_BACKEND: ROCM_AITER_FA
          VLLM_TRITON_FP4_GEMM_BPRESHUFFLE: '1'
          VLLM_TRITON_FP4_GEMM_USE_ASM: '0'
          VLLM_TRITON_FP4_GEMM_SPLITK_USE_BF16: '0'
          VLLM_ROCM_SHUFFLE_LAYOUT: '1'
          VLLM_NHD_TO_SHUFFLE: '1'
          VLLM_KV_CACHE_LAYOUT: NHD
          VLLM_NHD_SHUFFLE_FUSED: '1'
          VLLM_NHD_SHUFFLE_ASYNC: '1'
          VLLM_NHD_SHUFFLE_PERLAYER: '0'
          VLLM_FP8_KV_CROSS_PLATFORM: '0'
          VLLM_MIN_REQUEST_DECODE_STEP: '3072'
          VLLM_SUBSEQUENT_DECODE_STEPS: '32'
      vllm_engine_config:
        model: ${oc.env:MODEL_ROOT}/llama2-70b/llama2-70b-chat-hf/orig
        tensor_parallel_size: 1
        pipeline_parallel_size: 1
        data_parallel_size: 8
        max_model_len: 2048
        dtype: bfloat16
        kv_cache_dtype: fp8
        max_num_batched_tokens: 65536
        max_num_seqs: 2048
        gpu_memory_utilization: 0.92
        block_size: 16
        disable_log_stats: true
        h200:
          tensor_parallel_size: 1
          data_parallel_size: 8
          max_num_seqs: 2048
          max_num_batched_tokens: 65536
          gpu_memory_utilization: 0.95
        mi350x:
          max_num_seqs: 3072
          max_num_batched_tokens: 131072
          gpu_memory_utilization: 0.94
        b300:
