benchmark_name: llama2-70b
profiles:
  standalone_h200:
    offline:
      benchmark_name: llama2-70b
      backend: standalone
      model_base: ${oc.env:MODEL_ROOT}/llama2-70b/llama2-70b-chat-hf
      runtime_patches: [skip_dp_allreduce, gc_gen2, allreduce_interval, input_queue_limit]
      servers:
        prefill: ['${oc.env:H200_HOST}:8100']
        decode: ['${oc.env:MI350X_HOST}:8100']
        standalone: ['${oc.env:H200_HOST}:8100']
      pd_config:
        model_name: llama2-70b
        tokenizer_path: ${oc.env:MODEL_ROOT}/llama2-70b/llama2-70b-chat-hf/orig
        prefill_max_tokens: 1
        prefill_concurrency: 1024
        decode_concurrency: 2048
        local_decode_concurrency: 1024
        local_decode_ratio: 0.0
        prefill_timeout: 600
        decode_timeout: 600
        health_check_timeout: 300
        decode_addr: ${oc.env:MI350X_HOST}
        zmq_prefill_pull_port: 5555
        zmq_prefill_push_port: 5556
        zmq_decode_pull_port: 5557
        zmq_decode_push_port: 5558
        b300:
          tokenizer_path: ${oc.env:MODEL_ROOT}/llama2-70b/llama2-70b-chat-hf/nvfp4_modelopt
      prefiller:
        kv_cache_dtype: fp8
        tp_size: 1
        dp_size: 8
        max_model_len: 2048
        max_num_seqs: 2048
        max_num_batched_tokens: 49152
        gpu_memory_utilization: 0.92
        block_size: 16
        enable_prefix_caching: false
        enable_chunked_prefill: false
        h100: {}
        h200:
          max_num_batched_tokens: 32768
          gpu_memory_utilization: 0.88
          enforce_eager: false
          enable_prefix_caching: false
          enable_chunked_prefill: true
          async_scheduling: true
          cudagraph_mode: FULL_AND_PIECEWISE
          compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
        mi350x:
          max_num_batched_tokens: 65536
          gpu_memory_utilization: 0.94
      decoder:
        kv_cache_dtype: fp8
        tp_size: 1
        dp_size: 8
        max_model_len: 2048
        max_num_seqs: 2048
        max_num_batched_tokens: 65536
        gpu_memory_utilization: 0.95
        block_size: 16
        enable_prefix_caching: false
        h100: {}
        h200:
          max_num_seqs: 1024
          max_num_batched_tokens: 32768
          gpu_memory_utilization: 0.92
          enforce_eager: false
          cudagraph_mode: FULL_AND_PIECEWISE
          compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
          cudagraph_capture_range:
          - [4096, 0, -8]
          - 4
          - 2
          - 1
        mi350x:
          suffix: fp4_quantized_gptq
          quantization: quark
          max_num_seqs: 4096
          max_num_batched_tokens: 8192
          gpu_memory_utilization: 0.97
          enable_chunked_prefill: true
          cudagraph_mode: FULL_AND_PIECEWISE
          compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
          cudagraph_capture_range:
          - [8192, 0, -32]
          - 16
          - 8
          - 4
          - 2
          - 1
          disable_custom_all_reduce: true
      standalone:
        kv_cache_dtype: fp8
        tp_size: 1
        dp_size: 8
        max_model_len: 2048
        max_num_seqs: 2048
        max_num_batched_tokens: 65536
        gpu_memory_utilization: 0.92
        block_size: 16
        enable_prefix_caching: false
        enable_chunked_prefill: true
        h100: {}
        h200:
          suffix: fp8_dynamic
          kv_cache_dtype: fp8
          tp_size: 1
          dp_size: 1
          max_num_seqs: 256
          max_num_batched_tokens: 8192
          gpu_memory_utilization: 0.9
          enable_prefix_caching: false
          enforce_eager: false
          cudagraph_mode: FULL_AND_PIECEWISE
          compile_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
          cudagraph_capture_range:
          - [1024, 0, -8]
          - 4
          - 2
          - 1
          offline:
            max_num_seqs: 512
            max_num_batched_tokens: 16384
            compile_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
            cudagraph_capture_range:
            - [2048, 0, -8]
            - 4
            - 2
            - 1
        mi350x:
          suffix: fp4_quantized_gptq
          quantization: quark
          max_num_seqs: 3392
          max_num_batched_tokens: 65536
          gpu_memory_utilization: 0.95
          enable_prefix_caching: false
          enforce_eager: false
          cudagraph_mode: FULL_AND_PIECEWISE
          compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192]
          cudagraph_capture_range:
          - [4096, 0, -8]
          - 4
          - 2
          - 1
          disable_custom_all_reduce: true
        b300:
          suffix: nvfp4_modelopt
          quantization: modelopt_fp4
          kv_cache_dtype: fp8
          tp_size: 1
          dp_size: 1
          max_model_len: 2048
          max_num_seqs: 2048
          max_num_batched_tokens: 65536
          gpu_memory_utilization: 0.85
          enable_prefix_caching: false
          enable_chunked_prefill: true
          enforce_eager: false
          cudagraph_mode: FULL_DECODE_ONLY
          compile_sizes: [2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048]
          cudagraph_capture_range:
          - [2048, 0, -8]
          - 4
          - 2
          - 1
          linear_backend: cutlass
      vllm_env_config:
        VLLM_LOGGING_LEVEL: ERROR
        VLLM_USE_V1: '1'
        VLLM_V1_USE_PREFILL_DECODE_ATTENTION: '1'
        mi350x:
          VLLM_V1_USE_PREFILL_DECODE_ATTENTION: '0'
