# LoadGen user.conf for the H200-STANDALONE submission system.
#
# The official mlperf.conf rules are concatenated automatically by the harness
# (src/main.py), so this file holds ONLY per-model overrides. run.sh auto-selects
# this file for `--backend standalone --hardware h200`.
#
# target_qps values are DEFAULTS. Real bracket runs override them per run with
#   ./run.sh <model> <scenario> performance --backend standalone --hardware h200 \
#            -- harness_config.target_qps=<N>
# (see mlperf/run_submission.sh). Latency rules (ttft/tpot) are MLPerf-mandated
# and identical across all systems. Proof citations note where a default came
# from the best current v6.1 valid run.

# LLAMA2-70B
llama2-70b.*.performance_sample_count_override = 24576
llama2-70b.Offline.min_duration = 600000
llama2-70b.Server.min_duration = 600000
llama2-70b.Offline.target_qps = 80
llama2-70b.Server.target_qps = 77

# LLAMA2-70B Interactive
llama2-70b-interactive.*.performance_sample_count_override = 24576
llama2-70b-interactive.Offline.min_duration = 600000
llama2-70b-interactive.Server.min_duration = 600000
llama2-70b-interactive.Offline.target_qps = 80
llama2-70b-interactive.Server.target_qps = 51

# GPT-OSS-120B
gpt-oss-120b.*.performance_sample_count_override = 6396
gpt-oss-120b.*.use_token_latencies = 1
gpt-oss-120b.Offline.min_duration = 600000
gpt-oss-120b.Server.min_duration = 600000
gpt-oss-120b.Offline.target_qps = 45
gpt-oss-120b.Server.target_qps = 36
gpt-oss-120b.Server.target_latency = 0
gpt-oss-120b.Server.ttft_latency = 3000
gpt-oss-120b.Server.tpot_latency = 80

# GPT-OSS-120B Interactive
gpt-oss-120b-interactive.*.performance_sample_count_override = 6396
gpt-oss-120b-interactive.*.sample_concatenate_permutation = 1
gpt-oss-120b-interactive.*.use_token_latencies = 1
gpt-oss-120b-interactive.Server.min_duration = 600000
gpt-oss-120b-interactive.Server.target_qps = 1.9
gpt-oss-120b-interactive.Server.target_latency = 0
gpt-oss-120b-interactive.Server.ttft_latency = 2000
gpt-oss-120b-interactive.Server.tpot_latency = 20

