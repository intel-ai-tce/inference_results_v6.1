# inference-endpoint config — GB300x72 Q3VL Server perf run (online, poisson, target_qps=1000).
# Job 396 (target_qps=1205, ~3% above the 65*18=1170 linear scale-up from the
# validated GB300x4 rung) failed the checker's Server latency constraint:
# TTFT median 60.0s / p99 ~119s vs the 60s target, and achieved QPS settled
# at 1033 (86% of offered load) -- the queue was backing up unboundedly, not
# just marginally over. 1000 is a ladder step below that ~1033 completion
# ceiling (which itself isn't proven sustainable, just what leaked through
# while already backlogged) -- close enough to give a real signal toward the
# max passing QPS, without just re-running the same failure as 1205/1200.

name: "online-qwen3-vl-235b-a22b-shopify-benchmark"
version: "1.0"
type: "online"
timeout: 14400

submission_ref:
  model: "qwen3-vl-235b-a22b"
  ruleset: "mlperf-inference-v6.1"

model_params:
  name: "${MODEL_NAME}"
  top_p: 1
  max_new_tokens: 150
  streaming: "on" # Required for TTFT/TPOT measurement

datasets:
  - name: shopify_product_catalogue::q3vl
    type: "performance"
  - name: shopify_product_catalogue::q3vl
    type: "accuracy"
    accuracy_config:
      eval_method: "shopify_category_f1"
      ground_truth: "ground_truth_category"
      extractor: "identity_extractor"
      num_repeats: 1

settings:
  # 7200 = TOTAL_GPUS (72) × per-instance (100).
  warmup:
    enabled: true
    n_requests: 7200
    drain: true

  runtime:
    min_duration_ms: 600000
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "poisson"
    target_qps: 1000

  client:
    num_workers: 8
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 16384
    worker_initialization_timeout: 120

  drain:
    warmup_timeout_s: 240.0 # Warmup drain timeout in seconds (None = wait indefinitely)
    performance_timeout_s: null # Performance drain timeout in seconds (None = wait indefinitely)
    accuracy_timeout_s: null # Accuracy drain timeout in seconds (None = wait indefinitely)

endpoint_config:
  endpoints:
    - "${FRONTEND_URL:-http://localhost:8000}"
  api_key: null

report_dir: results/qwen3_vl_235b_a22b_shopify_benchmark_server_gb300x72/
