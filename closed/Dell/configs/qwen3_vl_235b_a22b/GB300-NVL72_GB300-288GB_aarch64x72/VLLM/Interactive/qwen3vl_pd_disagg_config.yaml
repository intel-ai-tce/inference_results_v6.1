# Qwen3-VL - GB300-NVL72 SFlow example for Dynamo P/D disaggregation.
# Topology: Dynamo frontend on rank 0 + dedicated prefill workers on some
# nodes + dedicated decode workers on some other nodes.

variables:
  GPUS_PER_NODE:
    type: integer
    value: 4

  NUM_PREFILL_WORKERS:
    type: integer
    value: 22
  NUM_DECODE_WORKERS:
    type: integer
    value: 28

  PREFILL_TENSOR_PARALLEL_SIZE:
    type: integer
    value: 2
  DECODE_TENSOR_PARALLEL_SIZE:
    type: integer
    value: 1

  WORKFLOW_TIMEOUT:
    value: "230m"

  MODEL_REPO_ID:
    value: "nvidia/Qwen3-VL-235B-A22B-Instruct-NVFP4-MLPerf-Inference-Closed-V6.1-FP8-KV"

  ENDPOINT_CONFIG:
    value: "/work/configs/qwen3_vl_235b_a22b/GB300-NVL72_GB300-288GB_aarch64x72/VLLM/Interactive/endpoint.yaml"

