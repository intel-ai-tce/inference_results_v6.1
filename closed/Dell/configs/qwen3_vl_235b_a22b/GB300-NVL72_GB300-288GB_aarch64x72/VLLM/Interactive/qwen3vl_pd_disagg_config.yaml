  COMMON_VLLM_FLAGS:
    value: >-
      --async-scheduling
      --max-model-len 32768
      --block-size 64
      --override-generation-config '{"max_new_tokens": 150}'
      --limit-mm-per-prompt.video 0
      --no-enable-prefix-caching
      --enable-multimodal
      --kv-events-config '{"publisher":"null"}'
