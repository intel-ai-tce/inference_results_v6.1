# MI355 ROCm — 300 queries = 30 full batches (no partial flush).
# Validates LoadGen summary + timing without 30 s window partial-batch JIT hang.
*.Server.target_qps = 300
*.Server.min_query_count = 300
*.Server.target_latency = 80
*.Server.min_duration = 1
*.Server.max_duration = 600000

*.Offline.target_qps = 300
*.Offline.min_query_count = 300
*.Offline.min_duration = 1
