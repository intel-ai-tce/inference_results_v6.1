# Offline ceiling conf — derived from certified A-FUSE+C1+b48+D2 (10,595 q/s VALID Server).
# Offline.target_qps bumped to 12000 so the single Offline query issues
# target_qps*min_duration samples and the run stays >=600 s (VALID) above the
# measured ~10.5k+ q/s throughput (Offline has no latency bound).
*.Server.target_qps = 10600
*.Server.target_latency = 80
*.Server.target_latency_percentile = 99
*.Server.min_duration = 600000
*.Server.min_query_count = 1
*.Offline.target_qps = 12000
*.Offline.min_duration = 600000
*.Offline.min_query_count = 1
