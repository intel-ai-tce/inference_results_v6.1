# Profiling conf — NVE full-table path, b=6, AT the certified ~290 q/s ceiling
# (queue is saturated, so this measures whether GPU idle shrinks under load vs the
# qps=250 stable point). Short run: enough batches to pass DLRM_TORCH_PROFILER_SKIP
# then capture the window.
*.Server.target_qps = 290
*.Server.min_query_count = 10000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 70000

*.Offline.target_qps = 290
*.Offline.min_query_count = 10000
*.Offline.min_duration = 30000
