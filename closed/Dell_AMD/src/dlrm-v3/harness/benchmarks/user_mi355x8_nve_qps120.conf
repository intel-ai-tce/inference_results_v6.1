# MI355 ROCm Server perf — NVE path (pynve LinearUVM, MPI lookup, Triton HSTU).
# Plan 18 own-device-grant. Operating point below the measured NVE batch=6
# throughput ceiling (~220 q/s) so the queue does not build and p99 collapses
# to ~service time. min_query_count + min_duration sized for MLPerf Server
# early-stopping certification.
*.Server.target_qps = 120
*.Server.min_query_count = 8000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 120
*.Offline.min_query_count = 8000
*.Offline.min_duration = 60000
