# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=8 batch=10.
#
# Same conf as 2W/4W variants. qps=120 isolates route_lookup scaling
# vs W. Mode B aggregate throughput = 1-worker throughput (lockstep),
# so latency validity is not the goal; comms-cost decomposition is.
*.Server.target_qps = 120
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 120
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
