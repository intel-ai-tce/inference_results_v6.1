# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10
# Plan 04 + RCCL on-device routing — qps=200 safe-margin VALID probe.
#
# Mode B + RCCL service rate ≈ 425 q/s aggregate at b=10. At qps=200,
# ρ = 0.47, batch-fill worst-case (first sample of batch) = 45 ms,
# service p99 ≈ 26 ms. Predicted p99 ≈ 71-75 ms — comfortable VALID
# margin, mirrors the Mode A 1W safe-margin VALID (qps=300, p99=74 ms)
# at half the qps (lockstep dispatch caps Mode B aggregate at single-
# worker service rate; the W=2 win is memory sharding, not throughput).
*.Server.target_qps = 200
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 200
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
