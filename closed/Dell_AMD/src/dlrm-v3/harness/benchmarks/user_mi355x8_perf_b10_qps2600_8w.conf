# MI355 ROCm Server perf — multi-worker scale-out (NUM_WORKERS=8, batch=10).
#
# Full MI355 fleet (all 8 GPUs). With NUM_SHARDS=W and
# DLRM_ZMQ_MAX_INFLIGHT=W, per-worker pipelines independently at the
# single-W tight ceiling (~327 q/s). qps=325*8=2600 -> per-worker 325 q/s.
*.Server.target_qps = 2600
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 2600
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
