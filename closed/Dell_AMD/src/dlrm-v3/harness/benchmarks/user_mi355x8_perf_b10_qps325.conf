# MI355 ROCm Server perf — VALID ceiling probe (batch_size=10, qps=325, 60 s).
#
# Observed bracket so far (1 worker, Mode A GPU sparse, batch_size=10):
#   qps=300 -> VALID,   P99 = 74.2 ms (completed 301.5 QPS)
#   qps=350 -> INVALID, P99 = 118.9 ms (completed 351.6 QPS)
#   qps=400 -> INVALID, P99 = 2.8 s    (queue exploded, rho ~= 0.98)
#
# At observed batch.predict p99 = 24.8 ms, sustainable batch rate ~ 40/s
# = 395 q/s. qps=325 puts utilization at ~0.82, with batch-fill p99 ~46 ms
# and total p99 ~71 ms — should land just inside the 80 ms cap.
*.Server.target_qps = 325
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 180000

*.Offline.target_qps = 325
*.Offline.min_query_count = 2000
*.Offline.min_duration = 60000
