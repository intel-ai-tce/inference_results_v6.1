# MI355 ROCm Server perf — find VALID ceiling (batch_size=10, qps=350, 60s).
#
# Math at observed batch.predict p99 = 24.5 ms (Mode A GPU sparse, 1 worker):
#   batch_fill_p99 (Poisson) ~ 1.5 * 10 / 350 = 43 ms
#   predict_p99 + fill_p99   = 24.5 + 43 = 67.5 ms < 80 ms => VALID expected
#   utilization              : 350 / (1/0.0245 * 10) = 350 / 408 = 0.86
#
# At qps=400 the listener's per-tick serial wait (one batch in flight)
# pushed utilization to ~0.98 and the M/D/1 queue exploded the tail to
# P99 ~ 2.8 s. qps=350 keeps utilization < 0.9; expect VALID.
*.Server.target_qps = 350
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 180000

*.Offline.target_qps = 350
*.Offline.min_query_count = 2000
*.Offline.min_duration = 60000
