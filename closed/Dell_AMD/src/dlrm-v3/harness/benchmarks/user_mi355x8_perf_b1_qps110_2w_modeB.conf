# MI355 ROCm Server perf — Mode B b=1 W=2, Plan 04 + RCCL on-device
# routing — qps=110 (predicted VALID, ρ ≈ 0.86 against the measured
# ~128 q/s effective ceiling).
#
# qps=130 hit queue collapse (p99=176 ms); qps=100 was VALID with
# 13 ms headroom (p99=67 ms). qps=110 splits the bracket. ρ ≈ 0.86
# means queue tail starts pushing on the persistent 35 ms residual;
# total p99 likely 70-80 ms, near the edge.
*.Server.target_qps = 110
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 110
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
