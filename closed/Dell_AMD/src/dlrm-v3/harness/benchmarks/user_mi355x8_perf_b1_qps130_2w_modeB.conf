# MI355 ROCm Server perf — Mode B b=1 W=2, Plan 04 + RCCL on-device
# routing — qps=130 (predicted comfortable VALID, ρ ≈ 0.78).
#
# Mode B + RCCL b=1: service ~6 ms mean / ~9 ms p99 (vs gloo b=1 ~10 ms),
# single-worker service rate ≈ 167 q/s under lockstep. At qps=130,
# ρ=0.78, M/D/1 p99 queue ≈ 15-20 ms, plus the ~35 ms persistent tail
# residue we measured at qps=100 (ZMQ + lockstep poll jitter + Triton
# kernel-cache misses), total p99 ≈ 55-65 ms — VALID margin.
*.Server.target_qps = 130
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 130
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
