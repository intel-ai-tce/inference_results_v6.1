# MI355 ROCm Server perf — Mode B b=1 W=2, Plan 04 + RCCL on-device
# routing — qps=150 tight-ceiling probe (ρ ≈ 0.90).
#
# Mode B + RCCL b=1: single-worker service rate ≈ 167 q/s. At qps=150,
# ρ=0.90, M/D/1 p99 queue ≈ 4-5× service = 25-30 ms; plus the ~35 ms
# persistent tail residue + 6 ms service ≈ 65-70 ms p99 — at the
# 80 ms edge.
*.Server.target_qps = 150
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 150
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
