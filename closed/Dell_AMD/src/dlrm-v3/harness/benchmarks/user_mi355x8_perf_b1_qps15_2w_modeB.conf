# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=15 W=2.
#
# Fallback for the b=1 qps=20 conf if VALID fails on tail. At qps=15,
# rho ≈ 0.55 against the ~37 ms service ceiling, M/D/1 expected queue
# ~22 ms, total mean ~60 ms with comfortable p99 headroom under the
# 80 ms target.
*.Server.target_qps = 15
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 15
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
