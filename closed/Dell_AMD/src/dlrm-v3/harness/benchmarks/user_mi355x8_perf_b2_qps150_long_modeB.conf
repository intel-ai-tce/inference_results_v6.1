# MI355 ROCm Server perf — Mode B b=2 W=2, Plan 04 + RCCL — qps=150
# (long variant; safety-margin probe after qps=200 came back INVALID
# p99=142 ms with service confirmed at 8 ms p99).
#
# Hypothesis: b=2 has higher queue/jitter than M/D/1 predicts; dropping
# ρ from 0.8 (qps=200) to 0.6 (qps=150) should bring the tail under 80.
*.Server.target_qps = 150
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 150
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
