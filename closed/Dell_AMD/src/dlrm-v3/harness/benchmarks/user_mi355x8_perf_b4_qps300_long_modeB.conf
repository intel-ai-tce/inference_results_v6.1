# MI355 ROCm Server perf — Mode B b=4 W=2, Plan 04 + RCCL — qps=300
# (long variant for early-stop certification, predicted edge VALID).
#
# b=4 batch-fill p99 = 8.4/300 × 1000 = 28 ms; service ~13 ms; ρ
# ≈ 0.97 against ~308 q/s aggregate ceiling — queue tail dominates.
# Predicted p99 ≈ 13 + 28 + queue(~25-40 at ρ ≈ 0.97) ≈ 70-85 ms —
# right at the edge of the 80 ms target.
*.Server.target_qps = 300
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

