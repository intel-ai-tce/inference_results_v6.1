# MI355 ROCm Server perf — Mode B b=4 W=2, Plan 04 + RCCL — qps=350
# (queue collapse probe, ρ > 1).
#
# b=4 single-worker rate ~ 77 b/s = ~308 q/s aggregate ceiling. At
# qps=350, ρ > 1.0 — arrival > service, expected unbounded queue
# growth, INVALID/queue collapse signal.
*.Server.target_qps = 350
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 350
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
