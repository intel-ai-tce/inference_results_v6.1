# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=4 qps=50 W=2.
#
# Fallback if b=1 throughput is too low (b=1 ceiling ~27 q/s).
# With b=4: batch_fill = 4/qps × 1000 = 80 ms at qps=50 — already
# saturating the 80 ms budget BEFORE service. b=4 is therefore only
# meaningful at qps≥100 (fill ≤ 40 ms) AND if Mode B service at b=4
# stays under ~30 ms (route cost grows sub-linearly in b). qps=50 is
# the lower anchor for the b=4 bracket; expect INVALID by fill alone.
*.Server.target_qps = 50
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 50
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
