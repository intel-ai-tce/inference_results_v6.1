# MI355 ROCm Server perf — Mode B b=6, Plan 04 + Plan 05 — qps=250 xlong
# (120 s / 30 000 q for tail-statistic certification). Anchors the
# post-poll=2ms W=8 ceiling (60 s landed VALID 252.41 q/s p99=71.66 ms,
# 8.34 ms slack — well above the 3 ms re-anchor threshold but xlong
# is the production protocol).
*.Server.target_qps = 250
*.Server.min_query_count = 24000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 250
*.Offline.min_query_count = 24000
*.Offline.min_duration = 120000
