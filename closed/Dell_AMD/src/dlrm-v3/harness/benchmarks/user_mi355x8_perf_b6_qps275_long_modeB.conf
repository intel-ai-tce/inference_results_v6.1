# MI355 ROCm Server perf — Mode B b=6 W=2, Plan 04 + RCCL — qps=275
# (long, 60 s / 6000 q for early-stop certification).
#
# Direct comparison to b=4 qps=275 (INVALID p99=149 ms): does b=6
# amortize the per-batch overhead enough to flip this VALID?
# Predicted: service ~16 ms (interp b=1=6 b=10=24); batch-fill p99
# = gamma(5)p99 / qps × 1000 = 11.6/275 × 1000 = 42 ms; ρ ≈ 0.88 at
# the predicted ~313 q/s aggregate (effective per-batch ~ 19 ms incl
# 3 ms fixed overhead). Total p99 ≈ 16 + 42 + queue(~15) = ~73 ms,
# VALID.
*.Server.target_qps = 275
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 275
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
