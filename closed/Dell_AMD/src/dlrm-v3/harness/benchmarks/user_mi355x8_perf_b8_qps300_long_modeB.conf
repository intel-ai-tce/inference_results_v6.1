# MI355 ROCm Server perf — Mode B b=8 W=2, Plan 04 + RCCL — qps=300
# (long, 60 s / 6000 q for early-stop certification).
#
# Service ~20 ms (interp), batch-fill p99 = gamma(7)p99 = 14.5/300
# × 1000 = 48 ms; ρ ≈ 0.87 at predicted ~345 q/s aggregate (1/0.023
# × 8 with 3 ms overhead). Total p99 ≈ 20 + 48 + queue(~12) = ~80 ms,
# right at the edge.
*.Server.target_qps = 300
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 300
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
