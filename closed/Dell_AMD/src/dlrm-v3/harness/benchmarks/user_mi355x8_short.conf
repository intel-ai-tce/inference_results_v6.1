# MI355 ROCm — sustained Server smoke (30 s window, low QPS).
# Do not set max_async_queries=1 — LoadGen errors with "too many outstanding queries".
*.Server.target_qps = 12
*.Server.min_query_count = 200
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 120000

*.Offline.target_qps = 12
*.Offline.min_query_count = 200
*.Offline.min_duration = 30000
