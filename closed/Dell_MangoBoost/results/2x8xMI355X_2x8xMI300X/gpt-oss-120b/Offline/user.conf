# The format of this config file is 'key = value'.
# The key has the format 'model.scenario.key'. Value is mostly int64_t.
# Model maybe '*' as wildcard. In that case the value applies to all models.
# All times are in milli seconds
#
# gpt-oss-120b on 2 nodes x 8 MI355X, AGGREGATED: one client.py driving two
# server.py nodes (16 independent single-GPU engines), so the target_qps figures
# are whole-cluster numbers -- 2x the 8-GPU values in
# user_gpt-oss-120b_8x_mi355x.conf, which is the right starting point for
# embarrassingly-parallel replicas but is NOT measured. See that file for what
# Offline target_qps does and does not control.

# GPT-OSS-120B
gpt-oss-120b.*.performance_sample_count_override = 6396

gpt-oss-120b.Offline.target_qps = 220
gpt-oss-120b.Offline.min_duration = 600000
gpt-oss-120b.Offline.min_query_count = 6396

gpt-oss-120b.Server.target_qps = 197
gpt-oss-120b.Server.min_duration = 600000
# min_query_count is deliberately NOT set for Server: a submission must issue at
# least 270336 queries. Set it lower only for a quick iteration run.
