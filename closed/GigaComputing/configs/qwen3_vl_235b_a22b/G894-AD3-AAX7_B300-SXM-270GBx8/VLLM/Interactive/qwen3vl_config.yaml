# Qwen3-VL — B300x8 (8×B300 SXM6) single-node Interactive perf run.
#
# Topology: two dynamo.vllm workers, each TP=4 (2×TP=4 across the 8 GPUs), one per socket.
# Drives the 8k shopify dataset at poisson target_qps (endpoint.yaml).
# Gate: e2e p99 <= 1500 ms AND category-F1 >= 0.7799.
#
# NUMA: G894 exposes three NUMA nodes per CPU socket after the BIOS update.
# Keep each TP=4 worker on one complete socket: worker 0 -> nodes 0-2/GPUs 0-3,
# worker 1 -> nodes 3-5/GPUs 4-7. Each set contains the worker's 240 logical CPUs.
#
# Kernels: trtllm-MoE + cutedsl-linear (cutedsl-MoE is a decode-tie and regresses the
# Interactive tail; trtllm-MoE is the winner here). Zero-copy mm arena + h2devent
# CUDA-event slot release are baked into the -mmzc-h2devent image (arena default-on, 8 slots).
# --enable-expert-parallel + max-num-seqs 1024 are REQUIRED on B300x8: the GB300x4
# 128/no-EP recipe roughly doubles TPOT here (e2e p99 ~2145 ms -> fails the gate).

variables:
  TOTAL_GPUS:
    type: integer
    value: 8
  GPUS_PER_NODE:
    type: integer
    value: 8
  GPUS_PER_WORKER:
    description: "TP × PP × DP = 4 × 1 × 1 → 2 workers on the node. Must match VLLM_FLAGS."
    type: integer
    value: 4

  # The explicit map takes precedence over the legacy divisor/autodetection paths.
  CPU_BIND_DIVISOR:
    value: ""
  CPU_BIND_CORES:
    value: ""
  CPU_BIND_NUMA_MAP:
    value: "0-2;3-5"

  WORKFLOW_TIMEOUT:
    value: "230m"

  MODEL_REPO_ID:
    value: "nvidia/Qwen3-VL-235B-A22B-Instruct-NVFP4-MLPerf-Inference-Closed-V6.1-FP8-KV"

  CONTAINER_IMAGE:
    value: "/data/q3vl/nvidia+mlperf-inference-partner+nv-mlpinf-partner+v6.1-jul20-q3vl-amd64.sqsh"

  ENDPOINT_CONTAINER_IMAGE:
    value: "/data/q3vl/nvidia+mlperf-inference-partner+nv-mlpinf-partner+inference-endpoint+v6.1-jul20-q3vl-amd64.sqsh"

  ENDPOINT_CONFIG:
    value: "/work/configs/qwen3_vl_235b_a22b/G894-AD3-AAX7_B300-SXM-270GBx8/VLLM/Interactive/endpoint.yaml"

  WORKER_ENV_YAML:
    value: "/work/configs/qwen3_vl_235b_a22b/G894-AD3-AAX7_B300-SXM-270GBx8/VLLM/Interactive/worker_env.yaml"

  VLLM_FLAGS:
    value: >-
      --tensor-parallel-size 4
      --pipeline-parallel-size 1
      --data-parallel-size 1
      --disable-custom-all-reduce
      --async-scheduling
      --max-model-len 32768
      --max-num-seqs 1024
      --max-num-batched-tokens 13824
      --mm-encoder-attn-backend FLASHINFER
      --kernel-config '{"moe_backend": "flashinfer_trtllm", "linear_backend": "flashinfer_cutedsl"}'
      --override-generation-config '{"max_new_tokens": 150}'
      --limit-mm-per-prompt.video 0
      --no-enable-prefix-caching
      --enable-multimodal
      --kv-events-config '{"publisher":"null"}'
      --mm-processor-cache-gb 0
      --enable-expert-parallel
      --mm-encoder-attn-dtype=fp8
      --mm-encoder-fp8-scale-path=/work/configs/qwen3_vl_235b_a22b/_shared/vit_fp8_scales_all1.json
      --scheduling-policy priority
      --compilation-config '{"pass_config":{"fuse_norm_quant":true,"fuse_act_quant":true,"fuse_attn_quant":true},"use_inductor_graph_partition":true,"cudagraph_mm_encoder":"true","encoder_cudagraph_token_budgets":[1024,2048,3072,4096,5120,6144,7168,8192],"encoder_cudagraph_max_vision_items_per_batch":16,"encoder_cudagraph_max_frames_per_batch":16,"max_cudagraph_capture_size":13824,"cudagraph_capture_sizes":[1,2,4,8,16,24,32,40,48,56,64,72,80,88,96,104,112,120,128,136,144,152,160,168,176,184,192,200,208,216,224,232,240,248,256,272,288,304,320,336,352,368,384,400,416,432,448,464,480,496,512,576,640,704,768,832,896,960,1024,1088,1152,1216,1280,1344,1408,1472,1536,1600,1664,1728,1792,1856,1920,1984,2048,2112,2176,2240,2304,2368,2432,2496,2560,2624,2688,2752,2816,2880,2944,3008,3072,3136,3200,3264,3328,3392,3456,3520,3584,3648,3712,3776,3840,3904,3968,4032,4096,4160,4224,4288,4352,4416,4480,4544,4608,4672,4736,4800,4864,4928,4992,5056,5120,5184,5248,5312,5376,5440,5504,5568,5632,5696,5760,5824,5888,5952,6016,6080,6144,6208,6272,6336,6400,6464,6528,6592,6656,6720,6784,6848,6912,6976,7040,7104,7168,7232,7296,7360,7424,7488,7552,7616,7680,7744,7808,7872,7936,8000,8064,8128,8192,8256,8320,8384,8448,8512,8576,8640,8704,8768,8832,8896,8960,9024,9088,9152,9216,9280,9344,9408,9472,9536,9600,9664,9728,9792,9856,9920,9984,10048,10112,10176,10240,10304,10368,10432,10496,10560,10624,10688,10752,10816,10880,10944,11008,11072,11136,11200,11264,11328,11392,11456,11520,11584,11648,11712,11776,11840,11904,11968,12032,12096,12160,12224,12288,12352,12416,12480,12544,12608,12672,12736,12800,12864,12928,12992,13056,13120,13184,13248,13312,13376,13440,13504,13568,13632,13696,13760,13824]}'

