    value: 1

  # DGXB300 CPU binding: per-worker NUMA node + 2 PCT turbo cores.
  CPU_BIND_DIVISOR:
    value: "4"
  CPU_BIND_CORES:
    value: "1"

  WORKFLOW_TIMEOUT:
