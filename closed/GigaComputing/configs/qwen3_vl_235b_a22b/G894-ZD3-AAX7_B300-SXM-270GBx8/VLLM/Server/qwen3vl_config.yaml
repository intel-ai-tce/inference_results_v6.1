# Qwen3-VL — G894 B300x8 (8×B300 SXM6) single-node Server perf run (target_qps in endpoint.yaml).

variables:
  TOTAL_GPUS:
    type: integer
    value: 8
  GPUS_PER_NODE:
    type: integer
    value: 8
  GPUS_PER_WORKER:
    description: "TP × PP × DP = 1 × 1 × 1. Must match the corresponding flags in VLLM_FLAGS."
