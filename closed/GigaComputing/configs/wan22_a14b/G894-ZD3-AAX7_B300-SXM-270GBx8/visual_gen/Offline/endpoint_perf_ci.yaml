name: wan22-a14b-g894_b300x8-offline-perf-ci
version: '1.0'
type: offline

# CI smoke test only: 16 samples for a fast QPS gate (~10-15 min vs ~2h for full 144).
# Do not use for submission or performance reporting.

model_params:
  name: wan22
  max_new_tokens: 1
  streaming: 'off'

datasets:
  - name: wan22_perf
    type: performance
    path: /work/configs/wan22_a14b/_shared/data/wan22_prompts.jsonl
    samples: 16

settings:
  drain:
    warmup_timeout_s: 3600
    performance_timeout_s: 1800
  runtime:
    n_samples_to_issue: 16
    scheduler_random_seed: 16159082839903944936  # v6.1 ruleset schedule_rng_seed
    dataloader_random_seed: 2747215439041700203   # v6.1 ruleset sample_index_rng_seed
  load_pattern:
    type: max_throughput
  client:
    num_workers: 8
    warmup_connections: 0
    worker_initialization_timeout: 300.0
    transport:
      type: zmq
      recv_buffer_size: 134217728
      send_buffer_size: 134217728
  warmup:
    enabled: true
    n_requests: 2
    drain: true

endpoint_config:
  endpoints: []
  api_type: videogen
  api_key: null

report_dir: ${SFLOW_TASK_OUTPUT_DIR}
