name: wan22-a14b-singlestream-audit-test04
version: "1.0"
type: online

# SingleStream output-caching audit (MLPerf TEST04).
# Shared across all systems (GB200x4, GB200x72, GB300x4, GB300x72, B200x8, B300x8).
# Run standalone after the perf+acc submission run (audit.only: true).

model_params:
  name: wan22
  max_new_tokens: 1
  streaming: "off"

datasets:
  - name: wan22_perf
    type: performance
    path: /work/configs/wan22_a14b/_shared/data/wan22_prompts.jsonl
    samples: 50

audit:
  test: output_caching_test
  only: true
  samples: 50
  audit_samples: 50
  sample_index: 3
  threshold: 0.20

settings:
  drain:
    warmup_timeout_s: 3600
    performance_timeout_s: 3600
  runtime:
    n_samples_to_issue: 50
    scheduler_random_seed: 16159082839903944936  # v6.1 ruleset schedule_rng_seed
    dataloader_random_seed: 2747215439041700203   # v6.1 ruleset sample_index_rng_seed
  load_pattern:
    type: concurrency
    target_concurrency: 1
  client:
    num_workers: 1
    warmup_connections: 0
    worker_initialization_timeout: 300.0
  warmup:
    enabled: true
    n_requests: 10
    drain: true

endpoint_config:
  endpoints: []
  api_type: videogen
  api_key: null

report_dir: ${SFLOW_TASK_OUTPUT_DIR}
