[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nv-mlpinf"
version = "6.1.0"
description = "NVIDIA MLPerf Inference Harness"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

# Core dependencies — always installed
dependencies = [
    "nvmitten @ git+https://github.com/NVIDIA/mitten.git@main",
    "mlcommons-loadgen==6.0.16",
    "typeguard>=4.3.0",
    "onnx_graphsurgeon>=0.5.6",
    "setuptools_git_versioning",
    "scikit-build",
    "sentencepiece>=0.2.0",
    "datasets",
    "nvtx==0.2.14",
    "scipy==1.16.2",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "cupy-cuda12x==13.3.0"
]

# Per-benchmark optional dependencies
# Usage: pip install -e ".[llm]"  or  pip install -e ".[whisper]"
[project.optional-dependencies]
llm = [
    "nltk==3.9.1",
    "evaluate==0.4.3",
    "rouge_score==0.1.2",
    "grpcio>=1.67.1",
    "tritonclient==2.52.0",
    "gevent==24.11.1",
    "geventhttpclient==2.3.3",
    "httpx[http2]==0.28.1",
    "uvloop==0.21.0",
    "setproctitle==1.3.6",
    "pylatexenc==2.10",
    "huggingface_hub[cli]==0.34.0",
    "tiktoken==0.9.0",
    "safetensors==0.5.2",
    "num2words==0.5.14",
    "orjson==3.11.3",
]

whisper = [
    "openai-whisper==20250625",
    "librosa==0.10.1",
    "soundfile==0.13.0",
    "sox==1.5.0",
    "tiktoken==0.9.0",
    "num2words==0.5.14",
    "safetensors==0.5.2",
]

q3vl = [
    "onnx==1.16.2",
    "tensorrt",
]

[project.scripts]
nv-mlpinf = "nv_mlpinf.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nv_mlpinf" = ["**/*.sh", "**/*.txt", "**/*.json", "**/*.yml"]
