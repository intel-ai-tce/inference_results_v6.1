variables:
  CONTAINER_IMAGE:
    value: nvcr.io/nvidia/mlperf/mlperf-inference:tensorrt_llm_release-feat-1.2-mlpinf-b5ddff4_mlperf-main-f538816_jan28_aarch64
  WORK_DIR:
    value: ""
  SCRATCH_DIR:
    value: /tank/MLPERF/inference
  CONTAINER_MOUNTS:
    value: "${{ variables.WORK_DIR }}:/work,${{ variables.SCRATCH_DIR }}:/home/mlperf_inference_storage:ro"
  SLURM_ACCOUNT:
    value: coreai_mlperf_inference
  SLURM_PARTITION:
    value: def
  SLURM_TIME:
    value: "04:00:00"
  GPUS_PER_NODE:
    type: integer
    value: 4
  SLURM_NODES:
    type: integer
    value: ${{ ((variables.TOTAL_GPUS / variables.GPUS_PER_NODE) | round(0, "ceil")) | int }}

operators:
  - name: test_container
    type: srun
    container_image: ${{ variables.CONTAINER_IMAGE }}
    container_writable: true
    container_mount_home: true
    container_remap_root: true
    mpi: pmi2
    container_mounts:
      - ${{ variables.CONTAINER_MOUNTS }}
    container_workdir: /work
    export: "ALL,ENROOT_TRANSFER_RETRIES=3,ENROOT_CONNECT_TIMEOUT=60"

backends:
  - name: slurm_cluster
    type: slurm
    default: true
    account: ${{ variables.SLURM_ACCOUNT }}
    partition: ${{ variables.SLURM_PARTITION }}
    gpus_per_node: ${{ variables.GPUS_PER_NODE }}
    time: ${{ variables.SLURM_TIME }}
    nodes: ${{ variables.SLURM_NODES }}
    extra_args:
      - "--segment=${{ variables.SLURM_NODES }}"
      - "--exclusive"
