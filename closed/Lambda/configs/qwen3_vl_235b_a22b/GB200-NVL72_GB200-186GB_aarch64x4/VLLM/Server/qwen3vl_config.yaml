    type: integer
    value: 4
  GPUS_PER_NODE:
    type: integer
    value: 4
  GPUS_PER_WORKER:
    description: "TP × PP × DP = 1 × 1 × 1. Must match the corresponding flags in VLLM_FLAGS."
