# Wan 2.2 A14B — GB300-NVL72 x4 Offline (aggregated data-parallel).
# 4 single-GPU VisualGen replicas (cfg=1, ulysses=1) = 4 GPUs = 1 node.
# Mirrors the v6.0 reference GB300 Offline (dp_size=4); run a smaller slice of the
# full GB300-NVL72_GB300-288GB_aarch64x72 rack configuration.

variables:
  NUM_SERVERS:
    description: "Number of data-parallel Wan 2.2 server replicas."
    type: integer
    value: 4
  GPUS_PER_SERVER:
    description: "GPUs per replica = cfg_size * ulysses_size in visual_gen.yaml (1 for Offline)."
    type: integer
    value: 1
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.NUM_SERVERS * variables.GPUS_PER_SERVER }}
  BASE_PORT:
    type: integer
    value: 8000

  MODEL_PATH:
    description: "Local pre-quantized ModelOpt FP8 diffusers checkpoint (under the scratch mount)."
    value: /home/mlperf_inference_storage/models/wan22-a14b/Wan2.2-T2V-A14B-Diffusers-FP8
  VISUAL_GEN_YAML:
    value: /work/configs/wan22_a14b/GB300-NVL72_GB300-288GB_aarch64x4/visual_gen/Offline/visual_gen.yaml
  WORKER_ENV_YAML:
    value: /work/configs/wan22_a14b/_shared/worker_env.yaml
  ENDPOINT_CONFIG:
    value: /work/configs/wan22_a14b/GB300-NVL72_GB300-288GB_aarch64x4/visual_gen/Offline/endpoint_submission.yaml
  ENDPOINT_ENV_YAML:
    value: /work/configs/wan22_a14b/GB300-NVL72_GB300-288GB_aarch64x4/visual_gen/Offline/endpoint_env_vbench.yaml

  BENCHMARK:
    value: wan22-a14b
  SCENARIO:
    value: Offline
  SYSTEM_NAME:
    value: GB300-NVL72_GB300-288GB_aarch64x4
