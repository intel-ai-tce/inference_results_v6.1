name: online-qwen3-vl-235b-a22b-shopify-benchmark-b300x8
version: '1.0'
type: online
model_params:
  name: /hf_cache/models/qwen3vl-nvfp4
  top_p: 1.0
  max_new_tokens: 150
  streaming: 'on'
datasets:
- name: shopify_product_catalogue::q3vl
  type: performance
- name: shopify_product_catalogue::q3vl
  type: accuracy
  accuracy_config:
    eval_method: shopify_category_f1
    ground_truth: ground_truth_category
    extractor: identity_extractor
    num_repeats: 1
settings:
  runtime:
    min_duration_ms: 600000
    max_duration_ms: 0
    scheduler_random_seed: 16159082839903944936
    dataloader_random_seed: 2747215439041700203
  load_pattern:
    type: poisson
    target_qps: 70.0
  client:
    num_workers: 16
    log_level: INFO
    warmup_connections: -1
    max_connections: 2000
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
      io_threads: 4
      worker_io_threads: 1
      high_water_mark: 0
      linger: -1
      immediate: 1
    stream_all_chunks: false
    worker_initialization_timeout: 120.0
    worker_graceful_shutdown_wait: 0.5
    worker_force_kill_timeout: 0.5
    insecure: false
    max_idle_time: 4.0
    min_required_connections: -1
    worker_gc_mode: relaxed
  drain:
    warmup_timeout_s: 240.0
  warmup:
    enabled: true
    n_requests: 800
    salt: false
    drain: true
    warmup_random_seed: 42
endpoint_config:
  endpoints:
  - http://localhost:8000
  api_type: openai
report_dir: results/qwen3_vl_235b_a22b_shopify_benchmark_online_b300x8
timeout: 14400.0
verbose: false
enable_cpu_affinity: true
