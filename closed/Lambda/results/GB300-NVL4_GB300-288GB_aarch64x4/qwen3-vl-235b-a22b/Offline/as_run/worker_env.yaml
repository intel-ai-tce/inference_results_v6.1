DYN_LOG: info
VLLM_LOGGING_LEVEL: INFO
VLLM_USE_FLASHINFER_SAMPLER: 1
VLLM_USE_FLASHINFER_MOE_FP4: 1
VLLM_FLASHINFER_MOE_BACKEND: latency
VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: 1610612736
TOKIO_WORKER_THREADS: 32
OMP_NUM_THREADS: 64
VLLM_USE_TRITON_POS_EMBED: 1
DYN_REQUEST_PLANE: tcp
DYN_TCP_REQUEST_TIMEOUT: 120
DYN_TCP_CONNECT_TIMEOUT: 20
DYN_TCP_POOL_SIZE: 512
DYN_TCP_CHANNEL_BUFFER: 1024
# --- writable caches: container rootfs is read-only, /tmp is writable ---
# flashinfer/triton/torch derive cache from HOME (~/.cache); redirect HOME to /tmp.
HOME: /tmp/home
XDG_CACHE_HOME: /tmp/home/.cache
TRITON_CACHE_DIR: /tmp/home/.cache/triton
TORCHINDUCTOR_CACHE_DIR: /tmp/home/.cache/inductor
VLLM_CACHE_ROOT: /tmp/home/.cache/vllm
