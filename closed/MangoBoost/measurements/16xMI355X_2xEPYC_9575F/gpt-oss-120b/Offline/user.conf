# gpt-oss-120b loadgen user config for 2x8 MI355X, AGGREGATED (16 independent
# engines, one per GPU; no P/D). Overrides on top of conf/mlperf.conf.
# Format is 'model.scenario.key = value'; '*' is a model wildcard.
# All times are in milliseconds. min_query_count is the performance set (6396);
# an accuracy run drives the 4395-sample acc_eval_ref set (pass --dataset_path).
# Drop min_duration to 600000 (the MLPerf floor) for quick iteration, not submission.
#
# OFFLINE target_qps SIZES THE QUERY SET, it is not the scored metric: loadgen
# issues target_qps * min_duration samples as ONE query (170 * 2400 = 408000, i.e.
# 64 passes over the 6396-sample set; the floor is OFFLINE_MIN_SPQ = 24576) and
# reports the throughput actually measured. So UNDER-estimating is what breaks a
# run -- the machine drains the query set before min_duration and the summary says
# 'Min duration satisfied : NO'. Over-estimating only makes the run longer.
# 170 = 2x the 8-GPU reference figure (85, from the AMD MI355X reference conf
# code/gpt-oss-120b/user_mi355x.conf), which is the right starting point for 16
# embarrassingly-parallel replicas but is NOT MEASURED -- raise it to just above
# the first run's reported throughput.
*.Offline.target_qps = 170
*.Offline.min_duration = 600000
*.Offline.min_query_count = 6396

# Server is a 16-GPU figure. Interactive lives in the -interactive variant of this
# file (2000 ms TTFT / 15 ms TPOT, measured at 44).
*.Server.target_qps = 112
*.Server.min_duration = 600000
*.Server.min_query_count = 6396
