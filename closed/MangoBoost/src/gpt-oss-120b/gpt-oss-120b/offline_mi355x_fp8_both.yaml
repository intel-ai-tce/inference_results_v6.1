# fp8 variant of offline_mi355x for MI325X (gfx942) on STOCK vLLM 0.24.0.
# Derived from offline_mi355x.yaml. Goal: correctness-first run of the
# self-quantized w-fp8-a-fp8 gpt-oss-120b checkpoint. De-risked vs the gfx950
# baseline: explicit bfloat16 (checkpoint config.json has torch_dtype null),
# enforce_eager (skip torch.compile/cudagraph — that path is where the fp4
# a8w4 kernel crashed), AITER MoE override off (match the proven smoke test).
# NOT performance-tuned or MLPerf-comparable — engine A/B correctness only.
benchmark_name: gpt-oss-120b
scenario: offline
test_mode: performance
engine_version: sync

vllm_env_config:
  VLLM_LOGGING_LEVEL: "INFO"
  HARNESS_GC_LIMIT: 100000
  VLLM_USE_V1: 1
  VLLM_ROCM_USE_AITER: 1
  USE_FASTSAFETENSOR: 1
  SAFETENSORS_FAST_GPU: 1

vllm_engine_config:
  model: /model/gpt-oss-120b/fp4_quantized
  tensor_parallel_size: 1
  quantization: quark
  max_model_len: 32768
  gpu_memory_utilization: 0.90
  enforce_eager: False
  max_num_batched_tokens: 65536
  max_num_seqs: 1792
  enable_chunked_prefill: True
  block_size: 64
  enable_prefix_caching: False
  disable_log_stats: True
  dtype: bfloat16
  async_scheduling: True

vllm_sampling_config:
  temperature: 1
  min_tokens: 1
  max_tokens: 10240
  top_p: 1
  top_k: -1
  ignore_eos: False
  detokenize: False

harness_config:
  dataset_path: /data/gpt-oss-120b/perf_eval_ref.parquet
  accuracy_dataset_path: /data/gpt-oss-120b/acc_eval_ref.parquet
  mlperf_conf_path: /lab-mlperf-inference/mlperf_inference/mlperf.conf
  user_conf_path: /lab-mlperf-inference/code/gpt-oss-120b/user_mi355x.conf
  target_qps: -1
  total_sample_count: 6396
  accuracy_sample_count: 4395
  output_log_dir: /lab-mlperf-inference/logs
  enable_log_trace: False
  enable_warmup: True
  device_count: 8
  sorting:
    strategy: ignore
    buckets: [
      12.45692710500971,
      12.542803033483215,
      12.540764079874208,
      12.533327896123708,
      12.486551901564114,
      12.481994240555746,
      12.472878918539005,
      12.484752824850286,
    ]
