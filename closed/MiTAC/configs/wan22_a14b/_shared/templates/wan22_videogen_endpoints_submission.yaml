version: "0.1"

# Wan 2.2 T2V (wan22-a14b) VBench ACCURACY recipe.
#
# Same topology as wan22_videogen_endpoints_test_run.yaml, except the endpoint_benchmark
# step gets a GPU (ENDPOINT_GPUS): the endpoints `vbench` scorer runs its
# per-dimension models (CLIP/DINO/RAFT/...) on a GPU. Scoring runs *after* video
# generation, so the scorer reuses a server GPU (the servers are idle by then)
# instead of reserving an extra one — NUM_SERVERS can use every GPU on the node
# (e.g. 4-GPU node: NUM_SERVERS=4, ENDPOINT_GPUS=1).

# Shared server task — keep in sync with wan22_videogen_endpoints_test_run.yaml.
# Both templates use the identical videogen_server block; only the
# endpoint_benchmark task differs (accuracy adds ENDPOINT_GPUS + vbench scorer).
x-server-task: &server_task
  replicas:
    count: ${{ variables.NUM_SERVERS }}
    policy: parallel
  resources:
    gpus:
      count: ${{ variables.GPUS_PER_SERVER }}
  operator:
    name: test_container
    # Launch ONE MPI task per GPU. The VisualGen launcher requires
    # world_size == n_workers (cfg_size x ulysses_size x attn2d) — one rank per
    # GPU in the replica — and aborts otherwise ("Launcher world_size (N) does
    # not match n_workers (M). Launch exactly n_workers tasks."). So:
    #   ntasks          = GPUS_PER_SERVER (= n_workers)
    #   ntasks_per_node = min(GPUS_PER_SERVER, GPUS_PER_NODE)
    # Offline (1 GPU/replica) -> 1 task; SingleStream x4/x8 -> 4/8 tasks on one
    # node; x72 -> 72 tasks across 18 nodes (4/node). GPUS_PER_NODE must match
    # the system (4 for GB200/GB300, 8 for B200/B300).
    ntasks: ${{ variables.GPUS_PER_SERVER }}
    ntasks_per_node: ${{ [variables.GPUS_PER_SERVER, variables.GPUS_PER_NODE] | min }}
  script:
    - export PYTHONNOUSERSITE=1
    # Register this replica's URL (plain ip:port, one per line).
    - if [ "${SLURM_PROCID:-0}" = "0" ]; then echo "$(echo ${SFLOW_TASK_ASSIGNED_NODE_IPS} | cut -d',' -f1):$(( ${{ variables.BASE_PORT }} + ${SFLOW_REPLICA_INDEX} ))" >> ${{ artifacts.SERVER_URLS.path }}; fi
    # Load worker env (fixed latent, media storage, HF cache).
    - eval "$(python3 /work/scaleout/sflow/tools/run_with_env.py ${{ variables.WORKER_ENV_YAML }} | tee /dev/stderr)"
    # Each replica on the same node needs a unique MASTER_PORT for torch distributed
    # init_process_group (TCPStore rendezvous). Without this, replicas collide on the
    # default port and the last one to start fails with EADDRINUSE.
    - export MASTER_PORT=$(( ${{ variables.MASTER_PORT_BASE }} + ${SFLOW_REPLICA_INDEX} ))
    # Pin each task to a distinct node-local GPU. VisualGen external-launch mode
    # runs ONE rank per GPU and forms the worker group over MPI (operator mpi:
    # pmix). Do NOT use trtllm-llmapi-launch here — it routes ranks>0 into the
    # LLM executor-worker path and the VisualGen coordinator hangs "Waiting for
    # workers". Run trtllm-serve (commands.serve) directly per task instead.
    #
    # GPU index = (replica_index * gpus_per_server + node-local task id) % gpus_per_node.
    # SingleStream (1 replica, GPUS_PER_SERVER tasks) -> SLURM_LOCALID (0..N-1).
    # Offline (GPUS_PER_SERVER=1, NUM_SERVERS single-task replicas) -> each replica
    # is its own srun step so SLURM_LOCALID is always 0; without the replica term
    # every replica on a node would bind GPU 0 and OOM. Replicas are block-placed
    # GPUS_PER_NODE per node in SFLOW_REPLICA_INDEX order.
    - export CUDA_VISIBLE_DEVICES=$(( (${SFLOW_REPLICA_INDEX:-0} * ${{ variables.GPUS_PER_SERVER }} + ${SLURM_LOCALID:-0}) % ${{ variables.GPUS_PER_NODE }} ))
    - echo "GPU-PLACEMENT replica=${SFLOW_REPLICA_INDEX:-0} node=$(hostname) localid=${SLURM_LOCALID:-0} CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES}"
    - >
      python -m tensorrt_llm.commands.serve ${{ variables.MODEL_PATH }}
      --host 0.0.0.0
      --port $(( ${{ variables.BASE_PORT }} + ${SFLOW_REPLICA_INDEX} ))
      --visual_gen_args ${{ variables.VISUAL_GEN_YAML }}
      2>&1 | tee ${SFLOW_TASK_OUTPUT_DIR}/videogen_rank${SLURM_PROCID}.log
  probes:
    readiness:
      log_watch:
        regex_pattern: "Application startup complete"
      timeout: 1800
      interval: 10

variables:
  ENDPOINT_GPUS:
    description: "GPUs for the endpoint client step (VBench scorer needs a GPU). Must be >= 1."
    type: integer
    value: 1
artifacts:
  - name: SERVER_URLS
    uri: file://server_urls.txt
    content: ""

workflow:
  name: wan22_videogen_accuracy
  tasks:
    - name: videogen_server
      <<: *server_task

    # Generates videos, then scores them with the endpoints `vbench` scorer
    # (uv run --project <vbench .venv>). Needs a GPU (ENDPOINT_GPUS).
    - name: endpoint_benchmark
      operator:
        name: endpoint_sqsh
        ntasks: 1
        ntasks_per_node: 1
      resources:
        nodes:
          count: 1
        gpus:
          count: ${{ variables.ENDPOINT_GPUS }}
      script:
        - set -euo pipefail
        - export PYTHONNOUSERSITE=1
        - |
          _n=$(grep -vc '^[[:space:]]*$' ${{ artifacts.SERVER_URLS.path }})
          [ "$_n" -eq "${{ variables.NUM_SERVERS }}" ] || { echo "ERROR: only $_n/${{ variables.NUM_SERVERS }} servers registered in SERVER_URLS; aborting"; exit 1; }
        - SERVER_URLS_LIST=$(grep -v '^[[:space:]]*$' ${{ artifacts.SERVER_URLS.path }} | paste -sd ',')
        - 'echo "SERVER_URLS_LIST=${SERVER_URLS_LIST}"'
        - RESOLVED_ENDPOINT_YAML=${SFLOW_TASK_OUTPUT_DIR}/endpoint_resolved.yaml
        - >
          python3 /work/scaleout/sflow/tools/generate_endpoint_yaml.py
          --input ${{ variables.ENDPOINT_CONFIG }}
          --frontend-urls "${SERVER_URLS_LIST}"
          --output "${RESOLVED_ENDPOINT_YAML}"
        - eval "$(python3 /work/scaleout/sflow/tools/run_with_env.py ${{ variables.ENDPOINT_ENV_YAML }} | tee /dev/stderr)"
        - 'inference-endpoint benchmark from-config -c "${RESOLVED_ENDPOINT_YAML}"'
      depends_on:
        - videogen_server
