# MLPerf Inference v6.1 SUBMISSION user.conf for Llama-3.1-8B (closed division).
# v6.1 requires a minimum test duration of 600000 ms (10 minutes) for the
# performance runs. Target QPS values are the measured-valid operating points.
# All times are in milliseconds.

# LLAMA3.1-8b (Offline + Server)
llama3_1-8b.Offline.min_duration = 600000
llama3_1-8b.Server.min_duration = 600000
llama3_1-8b.Server.target_qps = 1175

# LLAMA3.1-8b Interactive (Server scenario, tighter TTFT/TPOT)
llama3_1-8b-interactive.Offline.min_duration = 600000
llama3_1-8b-interactive.Server.min_duration = 600000
llama3_1-8b-interactive.Server.target_qps = 1020
