backend: pytorch

tensor_parallel_size: 16
moe_expert_parallel_size: 16
enable_attention_dp: true
enable_lm_head_tp_in_adp: true
pipeline_parallel_size: 1
max_batch_size: 128
max_num_tokens: 6144
max_seq_len: 23200
cuda_graph_config:
  enable_padding: true
  batch_sizes:
  - 1
  - 2
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 28
  - 32
  - 36
  - 40
  - 44
  - 48
  - 52
  - 56
  - 60
  - 64
  - 72
  - 80
  - 88
  - 96
  - 104
  - 112
  - 120
  - 128
print_iter_log: true
enable_iter_perf_stats: true
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.9
  dtype: fp8
nvfp4_gemm_config:
  allowed_backends:
  - cutlass
  - cublaslt
  - cutedsl
  - cuda_core
moe_config:
  backend: CUTEDSL
  use_low_precision_moe_combine: true
cache_transceiver_config:
  max_tokens_in_buffer: 4608
  backend: UCX
# stream_interval controls how often generated tokens are flushed back. With
# use_token_latencies each flushed chunk's boundary token carries roughly
# stream_interval x per-iteration time, so it moves the TPOT tail. 50 here
# matches the trtllm-serve GB300 config; GB200 uses 100 to match its own.
stream_interval: 50
# Matches the trtllm-serve reference. An earlier note claimed this stopped decode
# workers registering with the frontend; that is not the case — measured at x72
# on 2026-07-28, workers register normally and throughput is unchanged
# (239,540 vs 240,274 baseline on GB200, inside the 239,380-240,274 run-to-run
# band). gpt-oss has always run it in both CTX and GEN.
num_postprocess_workers: 4
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: FIRST_COME_FIRST_SERVED
speculative_config:
  decoding_type: MTP
  num_nextn_predict_layers: 3
