TRTLLM_MOE_ENABLE_ALLTOALL_WITHOUT_ALLGATHER: '1'
MLPINF_HTTP_USE_COMPLETIONS: '1'
TRTLLM_SERVER_DISABLE_GC: '1'
TLLM_PROFILE_START_STOP: '1000-1100'
UCX_CUDA_IPC_ENABLE_MNNVL: 'n'
UCX_RNDV_SCHEME: 'put_zcopy'
TRTLLM_WORKER_DISABLE_GC: '1'
UCX_TLS: 'rc,ud,tcp,cuda_copy,cuda_ipc,gdr_copy,self'

# Static engine env, moved out of the sflow template (dynamic per-rank vars like
# FLASHINFER_WORKSPACE_BASE / HF_HOME must stay there — run_with_env.py emits
# single-quoted values, so ${SLURM_PROCID} would not expand).
# CUDA_DEVICE_MAX_CONNECTIONS: number of independent host->device work queues.
# Default 8 is fewer than the streams WIDEEP uses, so the expert all-to-all comm
# streams and the compute streams get multiplexed onto the same queue and
# serialise, losing the comm/compute overlap. Makefile.const:78 exports 32 for
# every engine process launched via make; the sflow path sets it here to match.
CUDA_DEVICE_MAX_CONNECTIONS: '32'
TLLM_LOG_LEVEL: 'INFO'
