variables:
  # Dynamo disagg, validated GB300 x72 topology (Kris Hung's dynamo gpt-oss
  # patch 645c8c4f: configs/GB300.../Interactive/gpt-oss-120b.py dynamo_cluster):
  # 20 CTX x DEP1 + 13 GEN x DEP4 + 28 distributed KV-router frontends (w=0.8)
  # = 72 GPUs / 18 nodes; 28 frontends spread over all 18 worker nodes with a
  # 2-per-node cap (srun block distribution doubles the first 10 = 5 CTX + 5 GEN
  # nodes, matching the submission launcher's round-robin overflow placement).
  NUM_CTX_SERVERS:
    type: integer
    value: 20
  GPUS_PER_CTX_RANK:
    type: integer
    value: 1
  NUM_GEN_SERVERS:
    type: integer
    value: 13
  GPUS_PER_GEN_RANK:
    type: integer
    value: 4
  # Seconds to delay each extra CTX replica sharing a node, so co-located
  # replicas do not materialise weights simultaneously. 0 = not needed here
  # (one CTX replica per node, or a checkpoint small next to host RAM).
  # Must be declared in every config: the template merges LAST, so a default
  # there would override this. See prefill_worker in dynamo_disagg_loadgen.yaml.
  CTX_LOAD_STAGGER_S:
    type: integer
    value: 0
  NUM_FRONTEND_SERVERS:
    type: integer
    value: 28
  # Distributed frontends: NUM_FRONTEND_SERVERS ranks spread over
  # NUM_FRONTEND_NODES nodes (FRONTENDS_PER_NODE each; ports 8000+local_rank).
  NUM_FRONTEND_NODES:
    type: integer
    value: 18
  FRONTENDS_PER_NODE:
    type: integer
    value: 2
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.NUM_CTX_SERVERS * variables.GPUS_PER_CTX_RANK + variables.NUM_GEN_SERVERS * variables.GPUS_PER_GEN_RANK }}

  FRONTEND_PORT:
    value: 8000

  # Model resolution for the dynamo.trtllm workers. Passed straight to
  # --model-path / --served-model-name (no nv_mlpinf config lookup).
  MODEL_PATH:
    value: /home/mlperf_inference_storage/models/gpt-oss/gpt-oss-120b
  SERVED_MODEL_NAME:
    value: openai/gpt-oss-120b

  TRTLLM_YAML_CTX:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x72/DYNAMO/Interactive/dynamo-disagg-ctx-dep1.yaml
  TRTLLM_ENV_YAML_CTX:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x72/DYNAMO/Interactive/dynamo-disagg-ctx-dep1-env.yaml
  TRTLLM_YAML_GEN:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x72/DYNAMO/Interactive/dynamo-disagg-gen-dep4.yaml
  TRTLLM_ENV_YAML_GEN:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x72/DYNAMO/Interactive/dynamo-disagg-gen-dep4-env.yaml

  FRONTEND_ROUTER_ARGS:
    description: "KV-router flags passed verbatim to python3 -m dynamo.frontend."
    value: "--router-mode kv --kv-overlap-score-weight 0.8 --router-replica-sync"

  BENCHMARK:
    value: gpt-oss-120b
  SCENARIO:
    value: Interactive
  SYSTEM_NAME:
    value: GB300-NVL72_GB300-288GB_aarch64x72
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_USE_DYNAMO:
    description: >-
      MLPINF_USE_DYNAMO for the harness. 0 for BOTH benchmarks now.

      It used to be 1 for gpt-oss, purely to get the FirstTokenComplete WAR on
      1-token final chunks (without it loadgen logged "record sample latency
      before first token", 73k errors, INVALID). That is now handled by
      MLPINF_FIRST_TOKEN_ALWAYS, which the template exports unconditionally and
      which does not touch stream draining.

      Keeping it at 1 was actively harmful: it also sets NOSKIP_FINAL_CHUNK, so
      the client does not break on finish_reason and instead waits for a
      terminating `data: [DONE]` from an endpoint the code itself notes does not
      handle connection cleanup properly. When that chunk never arrives the read
      blocks forever -- job 372979108 reached 99% (1,290,887/1,298,388) in 45
      min, then sat silent for 233 min with 7,501 samples outstanding and died
      at walltime with no summary.

      At 0 the client closes as soon as the answer is complete, exactly like the
      trtllm-serve path, so the stall is unreachable. It also recovers the ~5%
      that draining to [DONE] costs. DSR1 has always run at 0 against Dynamo
      without issue, including the 244k VALID submission.
    value: "0"
  HARNESS_EXTRA_ARGS:
    description: "Empty on purpose — harness.py drives loadgen (trtllm-serve pattern). This yields min_query_count=6396, a ~10 min min_duration-bound run, which is MLPerf-compliant (Server/Interactive requires only min_duration=600000 = 10 min; there is NO Server.min_query_count rule). The earlier 1,296,000 override ran ~44 min (over-length): gpt-oss GB300 develops a decode-batch straggler tail only visible in long runs and went INVALID (TPOT 40.6ms), so the compliant short run is preferred here."
    value: "--max_concurrency=5120"