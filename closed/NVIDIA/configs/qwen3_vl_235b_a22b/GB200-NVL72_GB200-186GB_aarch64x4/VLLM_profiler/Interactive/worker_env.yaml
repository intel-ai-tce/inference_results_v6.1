# Interactive env for the GB200-NVL4 profiling run (interactive mode). Same as
# VLLM/Interactive/ minus the dynamo request-plane vars (no dynamo here), plus
# VLLM_NVTX_SCOPES_FOR_PROFILING so vLLM emits the NVTX ranges nsight needs.
DYN_LOG: info
VLLM_LOGGING_LEVEL: INFO
VLLM_USE_FLASHINFER_SAMPLER: 1
VLLM_USE_FLASHINFER_MOE_FP4: 1
VLLM_FLASHINFER_MOE_BACKEND: latency
VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: 1610612736
TOKIO_WORKER_THREADS: 32
OMP_NUM_THREADS: 64
VLLM_USE_TRITON_POS_EMBED: 1
VLLM_NVTX_SCOPES_FOR_PROFILING: 1
