# Wan 2.2 A14B — GB200-NVL72 x4 SingleStream (low-latency).
# 1 replica spanning 4 GPUs (cfg=2 x ulysses=2). Mirrors the v6.0 reference GB200
# SingleStream.

variables:
  NUM_SERVERS:
    type: integer
    value: 1
  GPUS_PER_SERVER:
    description: "GPUs per replica = cfg_size * ulysses_size in visual_gen.yaml (4 for SingleStream)."
    type: integer
    value: 4
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.NUM_SERVERS * variables.GPUS_PER_SERVER }}
  BASE_PORT:
    type: integer
    value: 8000

  MODEL_PATH:
    description: "Local pre-quantized ModelOpt FP8 diffusers checkpoint (under the scratch mount)."
    value: /home/mlperf_inference_storage/models/wan22-a14b/Wan2.2-T2V-A14B-Diffusers-FP8
  VISUAL_GEN_YAML:
    value: /work/configs/wan22_a14b/GB200-NVL72_GB200-186GB_aarch64x4/visual_gen/SingleStream/visual_gen.yaml
  WORKER_ENV_YAML:
    value: /work/configs/wan22_a14b/_shared/worker_env.yaml
  ENDPOINT_CONFIG:
    value: /work/configs/wan22_a14b/GB200-NVL72_GB200-186GB_aarch64x4/visual_gen/SingleStream/endpoint_submission.yaml
  ENDPOINT_ENV_YAML:
    value: /work/configs/wan22_a14b/GB200-NVL72_GB200-186GB_aarch64x4/visual_gen/SingleStream/endpoint_env_vbench.yaml

  BENCHMARK:
    value: wan22-a14b
  SCENARIO:
    value: SingleStream
  SYSTEM_NAME:
    value: GB200-NVL72_GB200-186GB_aarch64x4
