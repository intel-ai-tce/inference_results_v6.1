# Wan 2.2 T2V VisualGenArgs — GB300 SingleStream (4 GPUs, one replica).
#
# Identical to GB300-NVL72_GB300-288GB_aarch64x72 SingleStream (ulysses_size=2,
# cfg_size=2 -> 4 GPUs). Mirrors the v6.0 reference GB300 SingleStream. Mapping:
#   v6_0 attn_type='te-fp8'              -> attention_config.backend: TE
#   v6_0 linear_type='te-fp8-per-tensor' -> linear FP8 from the checkpoint.
#
# quant_config intentionally OMITTED (see Offline visual_gen.yaml rationale).
#
# Determinism: fixed_latent_path via TLLM_VISUAL_GEN_FIXED_LATENT_PATH (worker_env.yaml).
attention_config:
  backend: TE
parallel_config:
  cfg_size: 2
  ulysses_size: 2
  parallel_vae_size: 4
cuda_graph_config:
  enable: false
