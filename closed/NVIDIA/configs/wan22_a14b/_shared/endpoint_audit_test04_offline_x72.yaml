name: wan22-a14b-offline-audit-test04-x72
version: "1.0"
type: offline

# Offline output-caching audit (MLPerf TEST04).
# For x72 systems (GB200-NVL72 x72, GB300-NVL72 x72).
# Run standalone after the perf+acc submission run (audit.only: true).

model_params:
  name: wan22
  max_new_tokens: 1
  streaming: "off"

datasets:
  - name: wan22_perf
    type: performance
    path: /work/configs/wan22_a14b/_shared/data/wan22_prompts.jsonl
    samples: 144

audit:
  test: output_caching_test
  only: true
  samples: 144
  audit_samples: 144
  sample_index: 3
  threshold: 0.10

settings:
  drain:
    warmup_timeout_s: 3600
    performance_timeout_s: 3600
  runtime:
    n_samples_to_issue: 144
    scheduler_random_seed: 16159082839903944936  # v6.1 ruleset schedule_rng_seed
    dataloader_random_seed: 2747215439041700203   # v6.1 ruleset sample_index_rng_seed
  load_pattern:
    type: max_throughput
  client:
    num_workers: 72
    warmup_connections: 0
    # TEST04 reconnects all 72 workers for the second (cached) pass; 300s is not
    # enough at x72 and the run dies with "Workers failed to initialize".
    worker_initialization_timeout: 600.0
  warmup:
    enabled: true
    n_requests: 10
    drain: true

endpoint_config:
  endpoints: []
  api_type: videogen
  api_key: null

report_dir: ${SFLOW_TASK_OUTPUT_DIR}
