# DSR1 disagg-OFFLINE (x72 4c8g) — CTX (prefill) engine. dep2 (TP=EP=2), MTP-0, bigbuf.
# Mirror of harness scaleout/shmoo/gen/ctx-dep2-mnt16384-mtp0-bigbuf-noperf.yaml.
# NOTE: cutedsl is NOT in nvfp4_gemm_config.allowed_backends here (prefill shapes -> 8x regression);
#       moe_config CUTEDSL + use_cute_dsl_bf16_* ARE fine on ctx.
backend: pytorch
tensor_parallel_size: 2
moe_expert_parallel_size: 2
enable_attention_dp: true
attention_dp_config:            # offline prefill-batch balancing across ADP ranks (dep2)
  enable_balance: false   # disabled: per-iter tp_allgather barrier deadlocked 267295 on a 1-rank stall
  batching_wait_iters: 10
  timeout_iters: 500
pipeline_parallel_size: 1
max_batch_size: 128
max_num_tokens: 16384
max_seq_len: 3200
cuda_graph_config: null
disable_overlap_scheduler: true
kv_cache_config:
  enable_block_reuse: false
  free_gpu_memory_fraction: 0.85
  dtype: fp8
moe_config:
  backend: CUTEDSL
nvfp4_gemm_config:
  allowed_backends: [cutlass, cublaslt, cuda_core]
cache_transceiver_config:
  max_tokens_in_buffer: 36864
  backend: UCX
scheduler_config:
  capacity_scheduler_policy: MAX_UTILIZATION
  context_chunking_policy: FIRST_COME_FIRST_SERVED
speculative_config: null          # MTP-0
use_cute_dsl_bf16_bmm: true
use_cute_dsl_bf16_gemm: true
print_iter_log: true
enable_iter_perf_stats: true
