variables:
  # IFB topology - B200x8 scale (1 node x 8 GPUs/node).
  DP_MULTIPLICITY:
    type: integer
    value: 1
  GPUS_PER_DP_RANK:
    type: integer
    value: 8
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.DP_MULTIPLICITY * variables.GPUS_PER_DP_RANK }}

  BASE_PORT:
    value: 8336

  MODEL_PATH:
    value: /home/mlperf_inference_storage/models/deepseek-r1/fp4-quantized-modelopt/deepseek_r1-torch-fp4
  TRTLLM_YAML:
    value: /work/configs/deepseek_r1/B200-SXM-180GBx8/TRTLLM/Offline/trtllm-serve-ifb-dep8.yaml
  TRTLLM_ENV_YAML:
    value: /work/configs/deepseek_r1/B200-SXM-180GBx8/TRTLLM/Offline/trtllm-serve-ifb-dep8-env.yaml

  BENCHMARK:
    value: deepseek-r1
  SCENARIO:
    value: Offline
  SYSTEM_NAME:
    value: B200-SXM-180GBx8
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
