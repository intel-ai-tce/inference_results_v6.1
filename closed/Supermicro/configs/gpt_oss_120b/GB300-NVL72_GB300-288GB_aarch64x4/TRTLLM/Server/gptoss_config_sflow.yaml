variables:
  # IFB topology - gb300x4 scale.
  DP_MULTIPLICITY:
    type: integer
    value: 4
  GPUS_PER_DP_RANK:
    type: integer
    value: 1
  TOTAL_GPUS:
    type: integer
    value: ${{ variables.DP_MULTIPLICITY * variables.GPUS_PER_DP_RANK }}

  BASE_PORT:
    value: 8336

  MODEL_PATH:
    value: /home/mlperf_inference_storage/models/gpt-oss/gpt-oss-120b
  TRTLLM_YAML:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x4/TRTLLM/Server/trtllm-serve-ifb-1gpu.yaml
  TRTLLM_ENV_YAML:
    value: /work/configs/gpt_oss_120b/GB300-NVL72_GB300-288GB_aarch64x4/TRTLLM/Server/trtllm-serve-ifb-1gpu-env.yaml

  BENCHMARK:
    value: gpt-oss-120b
  SCENARIO:
    value: Server
  SYSTEM_NAME:
    value: GB300-NVL72_GB300-288GB_aarch64x4
  TEST_MODE:
    description: "default performance only mode"
    value: PerformanceOnly
  HARNESS_EXTRA_ARGS:
    description: "Additional harness flags; TEST_MODE is passed separately."
    value: ""
