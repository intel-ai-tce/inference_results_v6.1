# inference-endpoint config — GB300-NVL4 single-node Q3VL Interactive perf run.
# Same as Server, but drives the smaller 8k shopify dataset.

name: "interactive-qwen3-vl-235b-a22b-shopify-8k-benchmark-nvl4"
version: "1.0"
type: "online"
timeout: 14400

submission_ref:
  model: "qwen3-vl-235b-a22b"
  ruleset: "mlperf-inference-v6.1"

model_params:
  name: "${MODEL_NAME}"
  top_p: 1
  max_new_tokens: 150
  streaming: "on"  # required for TTFT/TPOT measurement

datasets:
  - name: shopify_product_catalogue_8k::q3vl
    type: "performance"
  - name: shopify_product_catalogue_8k::q3vl
    type: "accuracy"
    accuracy_config:
      eval_method: "shopify_category_f1"
      ground_truth: "ground_truth_category"
      extractor: "identity_extractor"
      num_repeats: 1

settings:
  # 400 = TOTAL_GPUS (4) × per-instance (100).
  warmup:
    enabled: true
    n_requests: 400
    drain: true

  runtime:
    min_duration_ms: 600000
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "poisson"
    target_qps: 4

  client:
    num_workers: 5
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 1000
    worker_initialization_timeout: 120

  drain:
    warmup_timeout_s: 240.0 # Warmup drain timeout in seconds (None = wait indefinitely)
    performance_timeout_s: null # Performance drain timeout in seconds (None = wait indefinitely)
    accuracy_timeout_s: null # Accuracy drain timeout in seconds (None = wait indefinitely)

endpoint_config:
  endpoints:
    - "${FRONTEND_URL:-http://localhost:8000}"
  api_key: null

report_dir: results/qwen3_vl_235b_a22b_shopify_8k_benchmark_interactive_b300x8/
