name: wan22-a14b-gb300x4-offline-perf-only
version: '1.0'
type: offline

# Performance-only variant of endpoint_submission.yaml (no wan22_vbench accuracy
# dataset). Use with the no_vbench template for a perf number without VBench
# scoring (no scorer GPU or weight cache needed).

model_params:
  name: wan22
  max_new_tokens: 1
  streaming: 'off'

datasets:
  - name: wan22_perf
    type: performance
    path: /work/configs/wan22_a14b/_shared/data/wan22_prompts.jsonl
    samples: 144

settings:
  drain:
    warmup_timeout_s: 3600
    performance_timeout_s: 3600
  runtime:
    n_samples_to_issue: 144
    scheduler_random_seed: 16159082839903944936  # v6.1 ruleset schedule_rng_seed
    dataloader_random_seed: 2747215439041700203   # v6.1 ruleset sample_index_rng_seed
  load_pattern:
    type: max_throughput
  client:
    num_workers: 4
    warmup_connections: 0
    worker_initialization_timeout: 300.0
  warmup:
    enabled: true
    n_requests: 10
    drain: true

endpoint_config:
  endpoints: []
  api_type: videogen
  api_key: null

report_dir: ${SFLOW_TASK_OUTPUT_DIR}
