# MI350P 8-device functional online probe.
# True packed-int8 item table, BATCH=16, INFLIGHT=32, DLRM_NVE_GPU_CACHE_GB=1.
# qps is deliberately ~30% of the MI350/MI355 b32 online knee (7300 * 0.30 ~= 2200).
*.Server.target_qps = 2200
*.Server.target_latency = 80
*.Server.target_latency_percentile = 99
*.Server.min_duration = 90000
*.Server.min_query_count = 1
*.Offline.target_qps = 2200
*.Offline.min_duration = 90000
*.Offline.min_query_count = 1
