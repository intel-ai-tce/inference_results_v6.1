# MI355 ROCm Server perf — NVE path (pynve LinearUVM, MPI lookup, Triton HSTU).
# Plan 18 own-device-grant. BATCH_SIZE=1 (no batch-formation wait — the b=6 tail
# at low per-worker arrival rate was pure fill-wait, not compute: backend serves
# every batch in <=21 ms). qps=200 over 8 workers => ~25 q/s/worker, ~12.5 ms
# service => util ~30%, so p99 should collapse toward service time. Large query
# budget + duration for MLPerf Server early-stopping certification.
*.Server.target_qps = 200
*.Server.min_query_count = 30000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 200
*.Offline.min_query_count = 30000
*.Offline.min_duration = 120000
