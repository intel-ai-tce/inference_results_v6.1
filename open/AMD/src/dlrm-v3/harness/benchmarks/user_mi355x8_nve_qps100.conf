# MI355 ROCm Server perf — NVE path (pynve LinearUVM, MPI lookup, Triton HSTU).
# Plan 18 own-device-grant. qps=100 operating point: at qps=120 p99 was 92 ms
# (p97=80.5) — backend is ~12.5 ms/batch, the tail is pure queueing, so back off
# QPS to pull p99 < 80 ms with margin. Large query budget + duration for MLPerf
# Server early-stopping certification.
*.Server.target_qps = 100
*.Server.min_query_count = 20000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 100
*.Offline.min_query_count = 20000
*.Offline.min_duration = 120000
