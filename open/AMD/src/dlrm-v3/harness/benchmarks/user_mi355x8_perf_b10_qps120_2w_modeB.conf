# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10.
#
# Mode B = lockstep dispatch. Every worker processes every batch via MPI
# bcast so route_lookup all_to_all_single sees every worker on every
# batch. Aggregate throughput = single-worker throughput (NOT W*single).
# Measured per-batch service time at b=10 = ~40 ms (Mode A is ~25 ms;
# the ~15 ms gap is predict.sparse ~14 ms from the routed embedding
# lookup, dominated by CPU bucket/scatter + CPU↔GPU bounce under the
# gloo PG backend — not the actual a2a wire transfer, which the
# per-collective timing shows is sub-ms).
#
# Service rate ~25 batches/s/worker => total ~250 q/s. To meet p99 < 80
# ms we need rho <= ~0.5, i.e. target_qps <= 125. qps=120 sets rho=0.48,
# Erlang/M-D-1 expected queue mean ~18 ms + service ~40 ms = ~58 ms
# (p99 expected ~70-78 ms with some headroom). If still INVALID,
# lower to qps=100.
*.Server.target_qps = 120
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 120
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
