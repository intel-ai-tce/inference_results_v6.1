# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10
# Plan 04 + RCCL on-device routing — qps=250 predicted VALID, near ceiling.
#
# Mode B + RCCL service rate ≈ 425 q/s aggregate at b=10. At qps=250,
# ρ = 0.59, batch-fill worst-case = 36 ms, service p99 ≈ 26 ms,
# M/D/1 queue tail ~ 10 ms at this ρ. Predicted p99 ≈ 72-78 ms — at
# the edge but likely VALID. Use with DLRM_SPARSE_LOCKSTEP_POLL_MS=5
# (the default poll=100 added ~40 ms to p99 in early Plan 04 sweep).
*.Server.target_qps = 250
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 250
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
