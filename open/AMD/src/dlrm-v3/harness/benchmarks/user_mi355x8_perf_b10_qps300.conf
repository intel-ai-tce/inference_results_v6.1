# MI355 ROCm Server perf tune — batch_size=10, target_qps=300, 60 s window.
#
# Math at observed batch.predict p99 = 22.7 ms (Mode A GPU sparse, 1 worker):
#   batch_fill_p99 (Poisson) ~ 1.5 * batch_size / qps = 1.5 * 10 / 300 = 50 ms
#   target_latency budget    : 80 ms
#   => predict_p99 + fill_p99 = 22.7 + 50 = 72.7 ms < 80 ms => VALID expected
#
# Sustained capacity: 1 / 0.0227 ~ 44 batches/s = 440 queries/s, so qps=300
# leaves ~30% headroom for collate/zmq tail.
#
# min_duration=60s -> ~18000 queries at qps=300, well above LoadGen Server
# early-stopping floor (~2000-3000 for tight P99 distributions).
*.Server.target_qps = 300
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 180000

*.Offline.target_qps = 300
*.Offline.min_query_count = 2000
*.Offline.min_duration = 60000
