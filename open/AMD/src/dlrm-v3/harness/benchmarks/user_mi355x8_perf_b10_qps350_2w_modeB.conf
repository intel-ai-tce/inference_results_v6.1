# MI355 ROCm Server perf — Mode B (routed sparse) NUM_WORKERS=2 batch=10
# Plan 04 + RCCL on-device routing — qps=350 ceiling probe.
#
# Mode B + RCCL (post-Plan 04 fix + DLRM_SPARSE_PG_BACKEND=nccl):
# `batch.predict` measured 23.5 ms mean / ~26 ms p99 at W=2 qps=120
# (vs 36.2 ms mean / 40.7 ms p99 under gloo at the same qps). Per-rank
# service rate = 1/0.0235 = ~42 b/s. Lockstep means aggregate service
# rate ≈ single-worker (not W× single-worker) = ~425 q/s at b=10.
#
# At qps=350, batch arrival rate = 35 b/s, ρ = 35/42 = 0.83. M/D/1
# expected p99 queue delay ≈ 2-3× service ≈ 60-80 ms. LG-side batch
# fill (worst-case first sample) ≈ 9/350 = 26 ms. Service ≈ 26 ms p99.
# Total worst-case p99 ≈ 26 + ~60 (queue tail) + 26 = ~112 ms — likely
# INVALID, but only a single-step push above qps=300 so the ρ is
# probably close enough to make this the actual breakpoint.
#
# Companion configs: qps300_2w_modeB (predicted VALID safe margin),
# qps400_2w_modeB (predicted INVALID / queue collapse).
*.Server.target_qps = 350
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 350
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
