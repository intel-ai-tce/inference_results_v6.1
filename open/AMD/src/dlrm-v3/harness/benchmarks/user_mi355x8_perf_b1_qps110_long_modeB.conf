# MI355 ROCm Server perf — Mode B b=1 W=2, Plan 04 + RCCL on-device
# routing — qps=110 long variant for MLPerf early-stopping certification.
#
# Same operating point as user_mi355x8_perf_b1_qps110_2w_modeB.conf but
# with larger min_query_count + min_duration so MLPerf's early stopping
# criterion has enough samples to certify VALID. The 30s/2000-query
# variant cleared p99=77 ms < 80 ms but missed early-stop by 47 queries
# ("Performance constraints satisfied : Yes, Early stopping satisfied:
# NO"). 60s/6000-query gives ~6600 queries which certifies.
*.Server.target_qps = 110
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 110
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
