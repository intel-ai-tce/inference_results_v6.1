# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=20 W=2.
#
# Mode B in lockstep dispatch: every worker processes every batch, so
# aggregate q/s == 1 / service_time_per_batch (W-independent). At b=1
# the service path is dominated by predict.sparse (~14 ms route +
# ~22 ms dense) ≈ ~36 ms per batch → ceiling ~27 q/s. We pick qps=20
# (rho ≈ 0.73, M/D/1 expected queue ~50 ms, total ~86 ms — borderline
# vs 80 ms budget but worth probing). If INVALID, the next conf
# (qps15) drops to rho ≈ 0.55, mean total ~58 ms with much more p99
# headroom.
#
# b=1 has NO batch-fill latency, so the entire 80 ms budget belongs to
# service + queueing. Mode B at b=1 is essentially the only valid
# operating point for the harness end-to-end at this scale; b≥2 fails
# because batch_fill = (b-1)/qps × 1000 ≥ ~50 ms alone.
*.Server.target_qps = 20
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 20
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
