# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=30 LONG.
#
# Used for the W=4 and W=8 cross-checks. Mode B's aggregate q/s
# ceiling is mostly W-independent (lockstep dispatch), but the tail
# widens with W because the per-tick MPI allreduce + sequential
# broadcasts grow with the worker fan-out — W=2 b=1 qps=60 lands
# p99=37 ms VALID, but W=4 b=1 qps=60 spikes to p99=168 ms even
# though predict service stays ~7 ms. qps=30 sets rho ≈ 0.21 against
# the ~140 batches/s service rate, giving the lockstep tail enough
# slack at any W ≤ 8.
*.Server.target_qps = 30
*.Server.min_query_count = 10000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 600000

*.Offline.target_qps = 30
*.Offline.min_query_count = 10000
*.Offline.min_duration = 60000
