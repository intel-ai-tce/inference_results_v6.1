# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=60 W=2.
#
# b=1 W=2 baseline at qps=20 came in VALID with p99=24.6 ms — about 3×
# headroom under the 80 ms budget. Push the throughput closer to the
# real service-rate ceiling (~140 batches/s implied by batch.predict
# mean=7 ms). qps=60 sets rho ≈ 0.43, M/D/1 expected queue ≈ 8 ms,
# total mean ≈ 15 ms. Plenty of slack for the long tail too.
*.Server.target_qps = 60
*.Server.min_query_count = 2000
*.Server.target_latency = 80
*.Server.min_duration = 30000
*.Server.max_duration = 180000

*.Offline.target_qps = 60
*.Offline.min_query_count = 2000
*.Offline.min_duration = 30000
