# MI355 ROCm Server perf — Plan 01 Phase B — Mode B (routed) b=1 qps=60.
#
# Same operating point as user_mi355x8_perf_b1_qps60_2w_modeB.conf but
# with larger min_query_count + min_duration so MLPerf's early
# stopping criterion has enough samples to certify. At qps=60 with
# min_duration=60s we issue ~3600 queries, which clears the
# "{N} more queries" tail probe LoadGen requires for early stopping
# satisfied=Yes (the W=4 / W=8 lockstep paths have slightly wider
# tails than W=2 from the larger allreduce + broadcast fan-out, so
# the W=2-tuned 2000-query conf falls just short of certification
# while still passing the actual p99 < 80 ms constraint).
*.Server.target_qps = 60
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 60
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
