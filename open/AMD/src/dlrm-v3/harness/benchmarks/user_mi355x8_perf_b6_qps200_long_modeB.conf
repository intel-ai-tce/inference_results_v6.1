# MI355 ROCm Server perf — Mode B b=6 W=2/4/8, Plan 04 + RCCL — qps=200
# long variant (60 s / 6000 q for early-stop certification).
#
# Drop qps for W>2 runs: W=4 b=6 qps=275 came back INVALID (p99=111 ms,
# 33 ms wider tail than W=2's 78 ms) due to lockstep fan-out variance
# scaling with W (max of N IID per-rank spike tails). qps=200 gives
# more queue slack so the lockstep tail has room.
# Predicted p99 at W=4 b=6 qps=200 ≈ 25 (batch-fill) + 16 (service) +
# 5 (queue at ρ=0.65) + 20 (W=4 lockstep widening) ≈ 65 ms — VALID.
*.Server.target_qps = 200
*.Server.min_query_count = 6000
*.Server.target_latency = 80
*.Server.min_duration = 60000
*.Server.max_duration = 240000

*.Offline.target_qps = 200
*.Offline.min_query_count = 6000
*.Offline.min_duration = 60000
