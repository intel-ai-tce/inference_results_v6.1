# MI355 ROCm Server perf — Mode B b=6 W=2, Plan 04 + RCCL — qps=275
# extra-long variant for rock-solid headline certification.
#
# The 60 s long variant (16559 q) was Early-stop certified VALID at
# p99=74.49 ms with 5.5 ms headroom — but the b=6 qps=290 case taught
# us that 60 s windows can underestimate the tail. Running 120 s /
# 30000 q to bury any statistical uncertainty.
*.Server.target_qps = 275
*.Server.min_query_count = 30000
*.Server.target_latency = 80
*.Server.min_duration = 120000
*.Server.max_duration = 300000

*.Offline.target_qps = 275
*.Offline.min_query_count = 30000
*.Offline.min_duration = 120000
