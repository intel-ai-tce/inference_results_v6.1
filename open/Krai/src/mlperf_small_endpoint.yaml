# inference-endpoint config — H200x8 Q3VL Offline.

name: "offline-qwen3-vl-235b-a22b-shopify-benchmark-h200x8"
version: "1.0"
type: "offline"
timeout: 14400

submission_ref:
  model: "qwen3-vl-235b-a22b"
  ruleset: "mlperf-inference-v6.1"

model_params:
  name: "Qwen/Qwen3-VL-235B-A22B-Instruct"
  top_p: 1
  max_new_tokens: 150

datasets:
  - name: shopify_product_catalogue::q3vl
    type: "performance"
  - name: shopify_product_catalogue::q3vl
    type: "accuracy"
    accuracy_config:
      eval_method: "shopify_category_f1"
      ground_truth: "ground_truth_category"
      extractor: "identity_extractor"
      num_repeats: 1

settings:
  # 800 = TOTAL_GPUS (8) × per-instance (100).
  warmup:
    enabled: true
    n_requests: 800
    drain: true

  runtime:
    min_duration_ms: 600000
    scheduler_random_seed: 42
    dataloader_random_seed: 42

  load_pattern:
    type: "max_throughput"

  client:
    num_workers: 16
    transport:
      type: zmq
      recv_buffer_size: 16777216
      send_buffer_size: 16777216
    max_connections: 2000
    worker_initialization_timeout: 120

  # Requires endpoint image 9c91dfb2; null = drain in-flight requests indefinitely.
  drain:
    warmup_timeout_s: 240.0
    performance_timeout_s: null
    accuracy_timeout_s: null

endpoint_config:
  endpoints:
    - "http://localhost:30000"
  api_key: null

report_dir: /root/mlperf_bench/mlperf/results/vanilla_2/qwen3_vl_235b_a22b_shopify_benchmark_offline_h200x8/

