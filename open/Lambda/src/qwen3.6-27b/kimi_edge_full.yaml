# MLPerf edge-agentic reference workload (mlcommons/endpoints example
# 11_Edge_Agentic_Example) run against Kimi-K2.6 instead of the reference
# Qwen3.6-27B. OPEN division: the served model is the only change; all other
# parameters are the reference configuration.
# Honest identity: benchmark name = kimi-k2.6-edge-agentic. Not relabeled.
name: "kimi-edge-full"
version: "1.0"
type: "online"
timeout: 21600

model_params:
  name: "kimi-k2.6"
  temperature: 0
  seed: 42
  max_new_tokens: 1024
  chat_template_kwargs:
    thinking: false

datasets:
  - name: agentic_coding
    type: performance
    path: examples/11_Edge_Agentic_Example/agentic_coding_2.5h.jsonl
    accuracy_config:
      eval_method: agentic_inference_inline
    agentic_inference:
      turn_timeout_s: 600.0
      num_trajectories_to_issue: 20

  - name: bfcl_v4::function_calling
    type: "accuracy"
    generate_params:
      categories: ["non_live", "live", "hallucination"]
      category_sample_pct:
        non_live: 62
        live: 10
        hallucination: 10
      subset_floor: 25
    accuracy_config:
      eval_method: "bfcl_v4"
      ground_truth: "ground_truth"
      extractor: "function_call_extractor"
      num_repeats: 1

settings:
  service_ready_timeout_s: 120
  runtime:
    # v6.1 submission_checker required endpoint seeds (the shipped reference
    # example still carries the edge-device default seed 42 / min_duration_ms 0,
    # which the v6.1 checker's seeds_check / min_duration_check reject).
    min_duration_ms: 600000
    max_duration_ms: 14400000
    scheduler_random_seed: 16159082839903944936
    dataloader_random_seed: 2747215439041700203
  load_pattern:
    type: agentic_inference
    target_concurrency: 1
  client:
    num_workers: 4
    max_connections: 16
    warmup_connections: 0

endpoint_config:
  endpoints:
    - "http://localhost:8000"
  api_type: openai
  api_key: null

report_dir: /kimi/results/kimi_edge_full
